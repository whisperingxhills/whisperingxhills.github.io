<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Island Waterpark - 2026 Event Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --iw-blue: #0EA5E9;
  --iw-blue-dark: #0284C7;
  --iw-blue-deep: #0369A1;
  --iw-blue-light: #E0F2FE;
  --iw-orange: #F97316;
  --iw-orange-light: #FFF7ED;
  --iw-green: #22C55E;
  --iw-green-light: #F0FDF4;
  --iw-purple: #8B5CF6;
  --iw-purple-light: #F5F3FF;
  --iw-red: #EF4444;
  --iw-yellow: #EAB308;
  --iw-yellow-light: #FEF9C3;
  --iw-pink: #EC4899;
  --iw-pink-light: #FCE7F3;
  --iw-cyan: #06B6D4;
  --iw-dark: #1E293B;
  --iw-darker: #0F172A;
  --iw-light: #F8FAFC;
  --iw-gray: #64748B;
  --iw-gray-light: #94A3B8;
  --iw-border: #E2E8F0;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
  color: var(--iw-dark);
  min-height: 100vh;
  padding: 0;
}

/* ── Header ── */
.cal-header {
  background: linear-gradient(135deg, var(--iw-blue-dark) 0%, var(--iw-blue-deep) 100%);
  padding: 40px 24px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cal-header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 30%, rgba(255,255,255,0.05) 0%, transparent 50%);
  pointer-events: none;
}
.cal-header h1 {
  font-size: 28px;
  font-weight: 900;
  color: white;
  letter-spacing: 1px;
  text-transform: uppercase;
  position: relative;
}
.cal-header h1 span { color: var(--iw-orange); }
.cal-header p {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  margin-top: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  position: relative;
}

/* ── Legend ── */
.cal-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  justify-content: center;
  padding: 16px 24px;
  background: var(--iw-darker);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: rgba(255,255,255,0.8);
  font-weight: 500;
  letter-spacing: 0.3px;
}
.cal-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex-shrink: 0;
}

/* ── Filter Bar ── */
.cal-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 16px 24px;
  background: rgba(15,23,42,0.6);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.cal-filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.cal-filter-btn:hover {
  background: rgba(255,255,255,0.1);
  color: white;
}
.cal-filter-btn.active {
  background: var(--iw-blue);
  border-color: var(--iw-blue);
  color: white;
}

/* ── Month Container ── */
.cal-months {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}
.cal-month {
  margin-bottom: 32px;
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 1px 4px rgba(0,0,0,0.2);
}
.cal-month-header {
  padding: 16px 24px;
  background: linear-gradient(135deg, var(--iw-darker) 0%, var(--iw-dark) 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cal-month-header h2 {
  font-size: 20px;
  font-weight: 800;
  color: white;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.cal-month-header .month-info {
  font-size: 11px;
  color: var(--iw-gray-light);
  font-weight: 500;
}

/* ── Calendar Grid ── */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--iw-border);
}
.cal-dow {
  padding: 10px 4px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--iw-gray);
  background: var(--iw-light);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.cal-day {
  min-height: 90px;
  padding: 6px;
  background: white;
  position: relative;
  cursor: default;
  transition: all 0.15s ease;
}
.cal-day:hover:not(.cal-day--empty):not(.cal-day--closed) {
  background: #F1F5F9;
}
.cal-day--empty {
  background: #FAFBFC;
}
.cal-day--closed {
  background: #F9FAFB;
}
.cal-day--closed .cal-day-num {
  color: #CBD5E1;
}
.cal-day--today {
  outline: 2px solid var(--iw-blue);
  outline-offset: -2px;
  z-index: 1;
}

.cal-day-num {
  font-size: 13px;
  font-weight: 700;
  color: var(--iw-dark);
  margin-bottom: 3px;
}

.cal-day-hours {
  font-size: 9px;
  font-weight: 600;
  color: var(--iw-gray);
  margin-bottom: 3px;
  line-height: 1.3;
}
.cal-day--closed .cal-day-hours {
  color: #CBD5E1;
}

/* ── Event Tags ── */
.cal-tag {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  margin-top: 2px;
  margin-right: 2px;
  line-height: 1.4;
  white-space: nowrap;
}
.cal-tag--2for { background: #DBEAFE; color: #1D4ED8; }
.cal-tag--wavy { background: #D1FAE5; color: #047857; }
.cal-tag--family { background: #FDE68A; color: #92400E; }
.cal-tag--adult { background: #E9D5FF; color: #6B21A8; }
.cal-tag--neon { background: #FEF08A; color: #854D0E; border: 1px solid #FDE047; }
.cal-tag--fireworks { background: #FECDD3; color: #BE123C; }
.cal-tag--univision { background: #FFE4E6; color: #9F1239; }
.cal-tag--holiday { background: #FED7AA; color: #C2410C; }
.cal-tag--extended { background: #F0FDFA; color: #0F766E; font-size: 7px; }

/* ── Event Detail Popup ── */
.cal-popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.cal-popup-overlay.active { display: flex; }

.cal-popup {
  background: white;
  border-radius: 16px;
  max-width: 420px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 24px 48px rgba(0,0,0,0.4);
  animation: popIn 0.2s ease;
}
@keyframes popIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.cal-popup-header {
  padding: 20px 24px;
  background: linear-gradient(135deg, var(--iw-blue-dark), var(--iw-blue-deep));
  color: white;
}
.cal-popup-header h3 {
  font-size: 18px;
  font-weight: 800;
}
.cal-popup-header p {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 4px;
}
.cal-popup-body {
  padding: 20px 24px;
}
.cal-popup-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.cal-popup-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}
.cal-popup-label {
  font-size: 11px;
  color: var(--iw-gray);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.cal-popup-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--iw-dark);
  margin-top: 2px;
}
.cal-popup-events {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}
.cal-popup-close {
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  background: var(--iw-light);
  color: var(--iw-gray);
  font-weight: 700;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s;
}
.cal-popup-close:hover { background: var(--iw-border); color: var(--iw-dark); }

/* ── Upcoming Events Sidebar ── */
.cal-upcoming {
  max-width: 1100px;
  margin: 0 auto 48px;
  padding: 0 16px;
}
.cal-upcoming-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.cal-upcoming-header {
  padding: 16px 24px;
  background: linear-gradient(135deg, #7C3AED, #6D28D9);
  color: white;
}
.cal-upcoming-header h2 {
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.cal-upcoming-list {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 400px;
  overflow-y: auto;
}
.cal-upcoming-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--iw-light);
  transition: background 0.15s;
}
.cal-upcoming-item:hover { background: var(--iw-border); }
.cal-upcoming-date {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: var(--iw-blue);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.cal-upcoming-date .up-month {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.85;
}
.cal-upcoming-date .up-day {
  font-size: 18px;
  font-weight: 900;
  line-height: 1;
}
.cal-upcoming-info h4 {
  font-size: 13px;
  font-weight: 700;
  color: var(--iw-dark);
}
.cal-upcoming-info p {
  font-size: 11px;
  color: var(--iw-gray);
  margin-top: 2px;
}

/* ── Responsive ── */
@media (max-width: 640px) {
  .cal-header h1 { font-size: 20px; }
  .cal-day { min-height: 70px; padding: 4px; }
  .cal-day-num { font-size: 11px; }
  .cal-day-hours { font-size: 8px; }
  .cal-tag { font-size: 7px; padding: 1px 4px; }
  .cal-month-header h2 { font-size: 16px; }
  .cal-popup { margin: 16px; }
}
@media (max-width: 420px) {
  .cal-day { min-height: 56px; }
  .cal-tag { display: none; }
  .cal-day.has-events::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--iw-blue);
  }
}
</style>
</head>

  [7, 6, '11:00–6:00', [], {}],
  [7, 7, '11:00–11:00', ['adult'], {note:'Adult Swim 7–11 PM'}],
  [7, 8, '10:30–8:00', [], {}],
  // Week 3
  [7, 9, '11:00–7:00', [], {}],
  [7, 10, '11:00–6:00', ['2for'], {}],
  [7, 11, '11:00–6:00', ['wavy'], {}],
  // Aug 12 (Thu) – 14 (Sat): CLOSED
  [7, 15, '11:00–6:00', [], {}],
  // Week 4
  [7, 16, '11:00–6:00', [], {}],
  // Aug 17 (Mon) – 21 (Fri): CLOSED
  [7, 22, '11:00–6:00', [], {}],
  // Week 5
  [7, 23, '11:00–6:00', [], {}],
  // Aug 24 (Mon) – 28: CLOSED
  [7, 29, '11:00–6:00', [], {}],
  [7, 30, '11:00–6:00', [], {}],
  // Aug 31: CLOSED

  // ── SEPTEMBER ──
  // Sep 1-4: CLOSED
  [8, 5, '11:00–6:00', [], {}],
  [8, 6, '11:00–6:00', [], {}],
  [8, 7, '11:00–6:00', ['laborday'], {}],
];

// Build lookup: key = "M-D" → entry
const calLookup = {};
CALENDAR.forEach(e => { calLookup[e[0]+'-'+e[1]] = e; });

// Active filter
let activeFilter = 'all';

// ── Render ──
function renderCalendar() {
  const container = document.getElementById('calendarMonths');
  container.innerHTML = '';

  // Only show May through September
  for (let m = 4; m <= 8; m++) {
    const year = 2026;
    const firstDay = new Date(year, m, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(year, m+1, 0).getDate();

    // Count open days and events
    let openDays = 0, eventCount = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const entry = calLookup[m+'-'+d];
      if (entry) { openDays++; eventCount += entry[3].length; }
    }

    const monthEl = document.createElement('div');
    monthEl.className = 'cal-month';
    monthEl.id = 'month-' + m;

    // Should this month be visible given the filter?
    let monthHasFilterMatch = activeFilter === 'all';
    if (!monthHasFilterMatch) {
      for (let d = 1; d <= daysInMonth; d++) {
        const entry = calLookup[m+'-'+d];
        if (entry && entry[3].includes(activeFilter)) { monthHasFilterMatch = true; break; }
        if (activeFilter === 'holiday' && entry && entry[3].some(e => ['memorial','juneteenth','fathers','july4','laborday'].includes(e))) { monthHasFilterMatch = true; break; }
      }
    }
    if (!monthHasFilterMatch) { monthEl.style.display = 'none'; }

    // Header
    monthEl.innerHTML = `
      <div class="cal-month-header">
        <h2>${MONTHS[m]} 2026</h2>
        <span class="month-info">${openDays} open days · ${eventCount} events</span>
      </div>
    `;

    // Grid
    const grid = document.createElement('div');
    grid.className = 'cal-grid';

    // Day-of-week headers
    DAYS_SHORT.forEach(d => {
      const dow = document.createElement('div');
      dow.className = 'cal-dow';
      dow.textContent = d;
      grid.appendChild(dow);
    });

    // Empty cells before 1st
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-day cal-day--empty';
      grid.appendChild(empty);
    }

    // Day cells
    const today = new Date();
    for (let d = 1; d <= daysInMonth; d++) {
      const entry = calLookup[m+'-'+d];
      const cell = document.createElement('div');
      const isToday = today.getFullYear() === 2026 && today.getMonth() === m && today.getDate() === d;

      let classes = 'cal-day';
      if (!entry) classes += ' cal-day--closed';
      if (isToday) classes += ' cal-day--today';

      // Filter dimming
      let dimmed = false;
      if (activeFilter !== 'all' && entry) {
        const hasMatch = entry[3].includes(activeFilter) ||
          (activeFilter === 'holiday' && entry[3].some(e => ['memorial','juneteenth','fathers','july4','laborday'].includes(e)));
        if (!hasMatch) dimmed = true;
      }
      if (dimmed) cell.style.opacity = '0.3';

      if (entry && entry[3].length > 0) classes += ' has-events';
      cell.className = classes;

      // Number
      const num = document.createElement('div');
      num.className = 'cal-day-num';
      num.textContent = d;
      cell.appendChild(num);

      // Hours
      const hours = document.createElement('div');
      hours.className = 'cal-day-hours';
      hours.textContent = entry ? entry[2] : 'CLOSED';
      cell.appendChild(hours);

      // Tags
      if (entry && entry[3].length > 0) {
        const tagWrap = document.createElement('div');
        entry[3].forEach(evt => {
          const t = EVENT_TYPES[evt];
          if (!t) return;
          const tag = document.createElement('span');
          tag.className = 'cal-tag ' + t.cls;
          tag.textContent = t.label;
          tagWrap.appendChild(tag);
        });
        cell.appendChild(tagWrap);
      }

      // Click handler for days with events
      if (entry && (entry[3].length > 0 || (entry[4] && entry[4].note))) {
        cell.style.cursor = 'pointer';
        cell.addEventListener('click', () => showPopup(m, d, entry));
      }

      grid.appendChild(cell);
    }

    monthEl.appendChild(grid);
    container.appendChild(monthEl);
  }
}

// ── Upcoming Events ──
function renderUpcoming() {
  const list = document.getElementById('upcomingList');
  list.innerHTML = '';

  const now = new Date();
  const specials = CALENDAR
    .filter(e => e[3].length > 0 && !(e[3].length === 1 && (e[3][0] === '2for' || e[3][0] === 'wavy')))
    .map(e => ({
      date: new Date(2026, e[0], e[1]),
      month: e[0], day: e[1],
      hours: e[2], events: e[3], extras: e[4]
    }))
    .filter(e => e.date >= new Date(now.getFullYear(), now.getMonth(), now.getDate()))
    .sort((a,b) => a.date - b.date)
    .slice(0, 12);

  if (specials.length === 0) {
    list.innerHTML = '<div style="padding:16px;text-align:center;color:#94A3B8;font-size:13px;">No upcoming special events</div>';
    return;
  }

  specials.forEach(s => {
    const item = document.createElement('div');
    item.className = 'cal-upcoming-item';

    const eventNames = s.events.map(e => EVENT_TYPES[e]?.label || e).join(', ');
    const note = s.extras?.note || eventNames;

    item.innerHTML = `
      <div class="cal-upcoming-date">
        <span class="up-month">${MONTHS[s.month].slice(0,3)}</span>
        <span class="up-day">${s.day}</span>
      </div>
      <div class="cal-upcoming-info">
        <h4>${note}</h4>
        <p>${DAYS_SHORT[s.date.getDay()]} · ${s.hours}</p>
      </div>
    `;
    item.style.cursor = 'pointer';
    item.addEventListener('click', () => {
      const entry = calLookup[s.month+'-'+s.day];
      if (entry) showPopup(s.month, s.day, entry);
    });
    list.appendChild(item);
  });
}

// ── Popup ──
function showPopup(month, day, entry) {
  const overlay = document.getElementById('popupOverlay');
  const date = new Date(2026, month, day);
  const dayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][date.getDay()];

  document.getElementById('popupTitle').textContent =
    `${MONTHS[month]} ${day}, 2026`;
  document.getElementById('popupSubtitle').textContent = dayName;

  let bodyHTML = '';

  // Hours
  bodyHTML += `
    <div class="cal-popup-row">
      <span class="cal-popup-icon">🕐</span>
      <div>
        <div class="cal-popup-label">Park Hours</div>
        <div class="cal-popup-value">${entry[2]}</div>
      </div>
    </div>
  `;

  // Events
  if (entry[3].length > 0) {
    bodyHTML += `
      <div class="cal-popup-row">
        <span class="cal-popup-icon">🎉</span>
        <div>
          <div class="cal-popup-label">Special Events</div>
          <div class="cal-popup-events">
            ${entry[3].map(e => {
              const t = EVENT_TYPES[e];
              return t ? `<span class="cal-tag ${t.cls}" style="font-size:10px;padding:3px 8px;">${t.emoji} ${t.label}</span>` : '';
            }).join('')}
          </div>
        </div>
      </div>
    `;

    // Event descriptions
    entry[3].forEach(e => {
      const t = EVENT_TYPES[e];
      if (t && t.desc) {
        bodyHTML += `
          <div class="cal-popup-row" style="margin-left:30px;">
            <div>
              <div class="cal-popup-value" style="font-size:12px;font-weight:500;color:#64748B;">${t.desc}</div>
            </div>
          </div>
        `;
      }
    });
  }

  // Note / Holiday
  if (entry[4]) {
    if (entry[4].note) {
      bodyHTML += `
        <div class="cal-popup-row">
          <span class="cal-popup-icon">📋</span>
          <div>
            <div class="cal-popup-label">Details</div>
            <div class="cal-popup-value" style="font-size:13px;">${entry[4].note}</div>
          </div>
        </div>
      `;
    }
  }

  document.getElementById('popupBody').innerHTML = bodyHTML;
  overlay.classList.add('active');
}

document.getElementById('popupClose').addEventListener('click', () => {
  document.getElementById('popupOverlay').classList.remove('active');
});
document.getElementById('popupOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('popupOverlay').classList.remove('active');
  }
});

// ── Filters ──
document.querySelectorAll('.cal-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cal-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderCalendar();
  });
});

// ── Init ──
renderCalendar();
renderUpcoming();
</script>
</body>
</html>
