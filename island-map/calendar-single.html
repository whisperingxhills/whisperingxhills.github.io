<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Island Waterpark - 2026 Event Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --iw-blue: #0EA5E9;
  --iw-blue-dark: #0284C7;
  --iw-blue-deep: #0369A1;
  --iw-blue-light: #E0F2FE;
  --iw-orange: #F97316;
  --iw-orange-light: #FFF7ED;
  --iw-green: #22C55E;
  --iw-green-light: #F0FDF4;
  --iw-purple: #8B5CF6;
  --iw-purple-light: #F5F3FF;
  --iw-red: #EF4444;
  --iw-yellow: #EAB308;
  --iw-pink: #EC4899;
  --iw-cyan: #06B6D4;
  --iw-dark: #1E293B;
  --iw-darker: #0F172A;
  --iw-light: #F8FAFC;
  --iw-gray: #64748B;
  --iw-gray-light: #94A3B8;
  --iw-border: #E2E8F0;
}

html, body {
  height: 100%;
  overflow: hidden;
  touch-action: pan-y;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
  color: var(--iw-dark);
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.cal-header {
  background: linear-gradient(135deg, var(--iw-blue-dark) 0%, var(--iw-blue-deep) 100%);
  padding: 20px 24px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.cal-header::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 30%, rgba(255,255,255,0.05) 0%, transparent 50%);
  pointer-events: none;
}
.cal-header h1 {
  font-size: 22px;
  font-weight: 900;
  color: white;
  letter-spacing: 1px;
  text-transform: uppercase;
  position: relative;
}
.cal-header h1 span { color: var(--iw-orange); }
.cal-header p {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  margin-top: 4px;
  letter-spacing: 2px;
  text-transform: uppercase;
  position: relative;
}

/* ── Month Navigation ── */
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: var(--iw-darker);
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.cal-nav-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: white;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.cal-nav-btn:hover { background: rgba(255,255,255,0.12); }
.cal-nav-btn:active { transform: scale(0.95); }
.cal-nav-btn:disabled {
  opacity: 0.25;
  cursor: default;
  pointer-events: none;
}
.cal-nav-center {
  text-align: center;
}
.cal-nav-month {
  font-size: 22px;
  font-weight: 800;
  color: white;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.cal-nav-year {
  font-size: 11px;
  color: var(--iw-gray-light);
  margin-top: 2px;
  letter-spacing: 1px;
}
.cal-nav-dots {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 8px;
}
.cal-nav-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: all 0.2s ease;
  cursor: pointer;
}
.cal-nav-dot.active {
  background: var(--iw-blue);
  width: 18px;
  border-radius: 3px;
}

/* ── Legend (compact) ── */
.cal-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  justify-content: center;
  padding: 10px 16px;
  background: rgba(15,23,42,0.8);
  flex-shrink: 0;
}
.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: rgba(255,255,255,0.7);
  font-weight: 500;
}
.cal-legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── Calendar Sheet ── */
.cal-sheet-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.cal-sheet {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: white;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.cal-sheet.slide-left-out  { transform: translateX(-100%); opacity: 0; }
.cal-sheet.slide-right-out { transform: translateX(100%); opacity: 0; }
.cal-sheet.slide-left-in   { animation: slideInLeft 0.25s ease forwards; }
.cal-sheet.slide-right-in  { animation: slideInRight 0.25s ease forwards; }

@keyframes slideInLeft {
  from { transform: translateX(100%); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}
@keyframes slideInRight {
  from { transform: translateX(-100%); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}

/* ── Day-of-Week Headers ── */
.cal-dow-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--iw-light);
  border-bottom: 1px solid var(--iw-border);
  flex-shrink: 0;
}
.cal-dow {
  padding: 10px 4px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--iw-gray);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ── Calendar Grid ── */
.cal-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 1px;
  background: var(--iw-border);
}

.cal-day {
  padding: 4px 5px;
  background: white;
  position: relative;
  cursor: default;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.1s;
}
.cal-day:hover:not(.cal-day--empty):not(.cal-day--closed) {
  background: #F1F5F9;
}
.cal-day--empty {
  background: #FAFBFC;
}
.cal-day--closed {
  background: #F9FAFB;
}
.cal-day--closed .cal-day-num { color: #CBD5E1; }
.cal-day--closed .cal-day-hours { color: #CBD5E1; }

.cal-day--today {
  outline: 2px solid var(--iw-blue);
  outline-offset: -2px;
  z-index: 1;
}
.cal-day--today .cal-day-num {
  background: var(--iw-blue);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cal-day-num {
  font-size: 13px;
  font-weight: 700;
  color: var(--iw-dark);
  line-height: 1;
}

.cal-day-hours {
  font-size: 9px;
  font-weight: 600;
  color: var(--iw-gray);
  margin-top: 2px;
  line-height: 1.2;
}

/* ── Event Tags ── */
.cal-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  margin-top: auto;
  padding-top: 2px;
}
.cal-tag {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-transform: uppercase;
  white-space: nowrap;
  line-height: 1.5;
}
.cal-tag--2for { background: #DBEAFE; color: #1D4ED8; }
.cal-tag--wavy { background: #D1FAE5; color: #047857; }
.cal-tag--family { background: #FDE68A; color: #92400E; }
.cal-tag--adult { background: #E9D5FF; color: #6B21A8; }
.cal-tag--neon { background: #FEF08A; color: #854D0E; border: 1px solid #FDE047; }
.cal-tag--fireworks { background: #FECDD3; color: #BE123C; }
.cal-tag--univision { background: #FFE4E6; color: #9F1239; }
.cal-tag--holiday { background: #FED7AA; color: #C2410C; }

/* ── Event Detail Popup ── */
.cal-popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.cal-popup-overlay.active { display: flex; }

.cal-popup {
  background: white;
  border-radius: 16px;
  max-width: 400px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 24px 48px rgba(0,0,0,0.4);
  animation: popIn 0.2s ease;
}
@keyframes popIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.cal-popup-header {
  padding: 20px 24px;
  background: linear-gradient(135deg, var(--iw-blue-dark), var(--iw-blue-deep));
  color: white;
}
.cal-popup-header h3 { font-size: 18px; font-weight: 800; }
.cal-popup-header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
.cal-popup-body { padding: 20px 24px; }
.cal-popup-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.cal-popup-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.cal-popup-label {
  font-size: 11px; color: var(--iw-gray); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.cal-popup-value { font-size: 14px; font-weight: 600; color: var(--iw-dark); margin-top: 2px; }
.cal-popup-events { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.cal-popup-close {
  display: block; width: 100%; padding: 14px; border: none;
  background: var(--iw-light); color: var(--iw-gray);
  font-weight: 700; font-size: 13px; font-family: inherit;
  cursor: pointer; transition: background 0.15s;
}
.cal-popup-close:hover { background: var(--iw-border); color: var(--iw-dark); }

/* ── Month Info Bar ── */
.cal-month-info {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding: 8px 16px;
  background: white;
  border-bottom: 1px solid var(--iw-border);
  flex-shrink: 0;
}
.cal-month-stat {
  font-size: 11px;
  color: var(--iw-gray);
  font-weight: 600;
}
.cal-month-stat span {
  color: var(--iw-dark);
  font-weight: 800;
}

/* ── Responsive ── */
@media (max-width: 420px) {
  .cal-header { padding: 14px 16px 12px; }
  .cal-header h1 { font-size: 18px; }
  .cal-nav-month { font-size: 18px; }
  .cal-day { padding: 3px 4px; }
  .cal-day-num { font-size: 11px; }
  .cal-day-hours { font-size: 8px; }
  .cal-tag { font-size: 7px; padding: 1px 3px; }
  .cal-legend { padding: 6px 12px; gap: 4px 8px; }
  .cal-legend-item { font-size: 9px; }
}

@media (min-width: 641px) {
  .cal-day { padding: 6px 8px; }
  .cal-day-num { font-size: 15px; }
  .cal-day-hours { font-size: 10px; }
  .cal-tag { font-size: 9px; padding: 2px 6px; }
}
</style>
</head>

<!-- Header -->

const calLookup = {};
CALENDAR.forEach(e => { calLookup[e[0]+'-'+e[1]] = e; });

// ── State ──
let currentMonthIdx = 0; // index into SEASON_MONTHS

// Determine initial month
function getInitialMonth() {
  const now = new Date();
  const m = now.getMonth();
  const idx = SEASON_MONTHS.indexOf(m);
  if (idx !== -1) return idx;
  // Before season → first month, after → last
  if (m < SEASON_MONTHS[0]) return 0;
  return SEASON_MONTHS.length - 1;
}

// ── Render Month ──
function renderMonth(monthNum, direction) {
  const grid = document.getElementById('calGrid');
  const sheet = document.getElementById('calSheet');
  const year = 2026;
  const firstDay = new Date(year, monthNum, 1).getDay();
  const daysInMonth = new Date(year, monthNum + 1, 0).getDate();
  const today = new Date();

  // Animate
  if (direction) {
    sheet.className = 'cal-sheet ' + (direction === 'left' ? 'slide-left-out' : 'slide-right-out');
    setTimeout(() => {
      buildGrid(grid, monthNum, firstDay, daysInMonth, today);
      sheet.className = 'cal-sheet ' + (direction === 'left' ? 'slide-left-in' : 'slide-right-in');
    }, 200);
  } else {
    buildGrid(grid, monthNum, firstDay, daysInMonth, today);
  }

  // Update nav
  document.getElementById('navMonth').textContent = MONTHS[monthNum];
  document.getElementById('prevBtn').disabled = (currentMonthIdx === 0);
  document.getElementById('nextBtn').disabled = (currentMonthIdx === SEASON_MONTHS.length - 1);

  // Update dots
  document.querySelectorAll('.cal-nav-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentMonthIdx);
  });

  // Update month info
  let openDays = 0, eventCount = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const entry = calLookup[monthNum + '-' + d];
    if (entry) { openDays++; eventCount += entry[3].length; }
  }
  document.getElementById('monthInfo').innerHTML =
    `<span class="cal-month-stat"><span>${openDays}</span> open days</span>` +
    `<span class="cal-month-stat"><span>${eventCount}</span> special events</span>`;
}

function buildGrid(grid, monthNum, firstDay, daysInMonth, today) {
  grid.innerHTML = '';
  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const d = i - firstDay + 1;
    const cell = document.createElement('div');

    if (d < 1 || d > daysInMonth) {
      cell.className = 'cal-day cal-day--empty';
      grid.appendChild(cell);
      continue;
    }

    const entry = calLookup[monthNum + '-' + d];
    const isToday = today.getFullYear() === 2026 && today.getMonth() === monthNum && today.getDate() === d;

    let classes = 'cal-day';
    if (!entry) classes += ' cal-day--closed';
    if (isToday) classes += ' cal-day--today';
    cell.className = classes;

    // Number
    const num = document.createElement('div');
    num.className = 'cal-day-num';
    num.textContent = d;
    cell.appendChild(num);

    // Hours
    const hours = document.createElement('div');
    hours.className = 'cal-day-hours';
    hours.textContent = entry ? entry[2] : 'CLOSED';
    cell.appendChild(hours);

    // Tags
    if (entry && entry[3].length > 0) {
      const tagWrap = document.createElement('div');
      tagWrap.className = 'cal-tags';
      entry[3].forEach(evt => {
        const t = EVENT_TYPES[evt];
        if (!t) return;
        const tag = document.createElement('span');
        tag.className = 'cal-tag ' + t.cls;
        tag.textContent = t.label;
        tagWrap.appendChild(tag);
      });
      cell.appendChild(tagWrap);
    }

    // Click
    if (entry && (entry[3].length > 0 || (entry[4] && entry[4].note))) {
      cell.style.cursor = 'pointer';
      cell.addEventListener('click', () => showPopup(monthNum, d, entry));
    }

    grid.appendChild(cell);
  }

  // Adjust grid rows
  const rows = totalCells / 7;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

// ── Popup ──
function showPopup(month, day, entry) {
  const overlay = document.getElementById('popupOverlay');
  const date = new Date(2026, month, day);

  document.getElementById('popupTitle').textContent = `${MONTHS[month]} ${day}, 2026`;
  document.getElementById('popupSubtitle').textContent = DAYS_FULL[date.getDay()];

  let bodyHTML = `
    <div class="cal-popup-row">
      <span class="cal-popup-icon">🕐</span>
      <div>
        <div class="cal-popup-label">Park Hours</div>
        <div class="cal-popup-value">${entry[2]}</div>
      </div>
    </div>
  `;

  if (entry[3].length > 0) {
    bodyHTML += `
      <div class="cal-popup-row">
        <span class="cal-popup-icon">🎉</span>
        <div>
          <div class="cal-popup-label">Special Events</div>
          <div class="cal-popup-events">
            ${entry[3].map(e => {
              const t = EVENT_TYPES[e];
              return t ? `<span class="cal-tag ${t.cls}" style="font-size:10px;padding:3px 8px;">${t.emoji} ${t.label}</span>` : '';
            }).join('')}
          </div>
        </div>
      </div>
    `;
    entry[3].forEach(e => {
      const t = EVENT_TYPES[e];
      if (t && t.desc) {
        bodyHTML += `
          <div class="cal-popup-row" style="margin-left:30px;">
            <div><div class="cal-popup-value" style="font-size:12px;font-weight:500;color:#64748B;">${t.desc}</div></div>
          </div>
        `;
      }
    });
  }

  if (entry[4] && entry[4].note) {
    bodyHTML += `
      <div class="cal-popup-row">
        <span class="cal-popup-icon">📋</span>
        <div>
          <div class="cal-popup-label">Details</div>
          <div class="cal-popup-value" style="font-size:13px;">${entry[4].note}</div>
        </div>
      </div>
    `;
  }

  document.getElementById('popupBody').innerHTML = bodyHTML;
  overlay.classList.add('active');
}

document.getElementById('popupClose').addEventListener('click', () => {
  document.getElementById('popupOverlay').classList.remove('active');
});
document.getElementById('popupOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('popupOverlay').classList.remove('active');
});

// ── Navigation ──
document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentMonthIdx > 0) {
    currentMonthIdx--;
    renderMonth(SEASON_MONTHS[currentMonthIdx], 'right');
  }
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentMonthIdx < SEASON_MONTHS.length - 1) {
    currentMonthIdx++;
    renderMonth(SEASON_MONTHS[currentMonthIdx], 'left');
  }
});

// Swipe support
let touchStartX = 0;
let touchStartY = 0;
const sheetWrap = document.getElementById('sheetWrap');

sheetWrap.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

sheetWrap.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0 && currentMonthIdx < SEASON_MONTHS.length - 1) {
      currentMonthIdx++;
      renderMonth(SEASON_MONTHS[currentMonthIdx], 'left');
    } else if (dx > 0 && currentMonthIdx > 0) {
      currentMonthIdx--;
      renderMonth(SEASON_MONTHS[currentMonthIdx], 'right');
    }
  }
}, { passive: true });

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (document.getElementById('popupOverlay').classList.contains('active')) {
    if (e.key === 'Escape') document.getElementById('popupOverlay').classList.remove('active');
    return;
  }
  if (e.key === 'ArrowLeft' && currentMonthIdx > 0) {
    currentMonthIdx--;
    renderMonth(SEASON_MONTHS[currentMonthIdx], 'right');
  } else if (e.key === 'ArrowRight' && currentMonthIdx < SEASON_MONTHS.length - 1) {
    currentMonthIdx++;
    renderMonth(SEASON_MONTHS[currentMonthIdx], 'left');
  }
});

// ── Build dots ──
const dotsEl = document.getElementById('navDots');
SEASON_MONTHS.forEach((m, i) => {
  const dot = document.createElement('div');
  dot.className = 'cal-nav-dot';
  dot.addEventListener('click', () => {
    const dir = i > currentMonthIdx ? 'left' : i < currentMonthIdx ? 'right' : null;
    currentMonthIdx = i;
    renderMonth(SEASON_MONTHS[i], dir);
  });
  dotsEl.appendChild(dot);
});

// ── Init ──
currentMonthIdx = getInitialMonth();
renderMonth(SEASON_MONTHS[currentMonthIdx], null);
</script>
</body>
</html>
