 [6,29,'11:00\u20137:00',['wavy'],{}],
 [6,30,'11:00\u20137:00',[],{}],
 [6,31,'11:00\u201310:00',['family'],{note:'Family Night 6\u201310 PM'}],
 [7,1,'10:30\u20138:00',[],{}],
 [7,2,'11:00\u20137:00',[],{}],
 [7,3,'11:00\u20136:00',[],{}],
 [7,4,'11:00\u20136:00',['2for'],{}],
 [7,5,'11:00\u20136:00',['wavy'],{}],
 [7,6,'11:00\u20136:00',[],{}],
 [7,7,'11:00\u201311:00',['adult'],{note:'Adult Swim 7\u201311 PM'}],
 [7,8,'10:30\u20138:00',[],{}],
 [7,9,'11:00\u20137:00',[],{}],
 [7,10,'11:00\u20136:00',[],{}],
 [7,11,'11:00\u20136:00',['2for'],{}],
 [7,15,'11:00\u20137:00',[],{}],
 [7,16,'11:00\u20137:00',[],{}],
 [7,22,'11:00\u20136:00',[],{}],
 [7,23,'11:00\u20136:00',[],{}],
 [7,29,'11:00\u20136:00',[],{}],
 [7,30,'11:00\u20136:00',[],{}],
 [8,5,'11:00\u20136:00',[],{}],
 [8,6,'11:00\u20136:00',[],{}],
 [8,7,'11:00\u20136:00',['laborday'],{}]
 ];

 var calLookup = {};
 CALENDAR.forEach(function(e) { calLookup[e[0]+'-'+e[1]] = e; });

 var currentMonthIdx = 0;

 function getInitialMonth() {
 var now = new Date();
 var m = now.getMonth();
 var idx = SEASON_MONTHS.indexOf(m);
 if (idx !== -1) return idx;
 if (m < SEASON_MONTHS[0]) return 0;
 return SEASON_MONTHS.length - 1;
 }

 function renderMonth(monthNum, direction) {
 var grid = document.getElementById('iwcGrid');
 var sheet = document.getElementById('iwcSheet');
 var firstDay = new Date(2026, monthNum, 1).getDay();
 var daysInMonth = new Date(2026, monthNum + 1, 0).getDate();
 var today = new Date();

 if (direction) {
 sheet.className = 'iwc-sheet ' + (direction === 'left' ? 'slide-left-out' : 'slide-right-out');
 setTimeout(function() {
 buildGrid(grid, monthNum, firstDay, daysInMonth, today);
 sheet.className = 'iwc-sheet ' + (direction === 'left' ? 'slide-left-in' : 'slide-right-in');
 }, 200);
 } else {
 buildGrid(grid, monthNum, firstDay, daysInMonth, today);
 }

 document.getElementById('iwcNavMonth').textContent = MONTHS[monthNum];
 document.getElementById('iwcPrevBtn').disabled = (currentMonthIdx === 0);
 document.getElementById('iwcNextBtn').disabled = (currentMonthIdx === SEASON_MONTHS.length - 1);

 var dots = document.querySelectorAll('#iwp-calendar .iwc-nav-dot');
 for (var i = 0; i < dots.length; i++) {
 dots[i].className = 'iwc-nav-dot' + (i === currentMonthIdx ? ' active' : '');
 }

 var openDays = 0;
 for (var d = 1; d <= daysInMonth; d++) {
 if (calLookup[monthNum + '-' + d]) openDays++;
 }
 document.getElementById('iwcMonthInfo').innerHTML = '<span class="iwc-month-stat"><span>' + openDays + '</span> DAYS TO SPLASH WITH US!</span>';
 }

 function buildGrid(grid, monthNum, firstDay, daysInMonth, today) {
 grid.innerHTML = '';
 var totalCells = Math.ceil((firstDay + daysInMonth) /7) * 7;

 for (var i = 0; i < totalCells; i++) {
 var d = i - firstDay + 1;
 var cell = document.createElement('div');

 if (d < 1 || d > daysInMonth) {
 cell.className = 'iwc-day iwc-day--empty';
 grid.appendChild(cell);
 continue;
 }

 var entry = calLookup[monthNum + '-' + d];
 var isToday = today.getFullYear() === 2026 && today.getMonth() === monthNum && today.getDate() === d;

 var classes = 'iwc-day';
 if (!entry) classes += ' iwc-day--closed';
 if (isToday) classes += ' iwc-day--today';
 cell.className = classes;

 var num = document.createElement('div');
 num.className = 'iwc-day-num';
 num.textContent = d;
 cell.appendChild(num);

 var hours = document.createElement('div');
 hours.className = 'iwc-day-hours';
 hours.textContent = entry ? entry[2] : 'CLOSED';
 cell.appendChild(hours);

 if (entry && entry[3].length > 0) {
 var tagWrap = document.createElement('div');
 tagWrap.className = 'iwc-tags';
 entry[3].forEach(function(evt) {
 var t = EVENT_TYPES[evt];
 if (!t) return;
 var tag = document.createElement('span');
 tag.className = 'iwc-tag ' + t.cls;
 tag.textContent = t.label;
 tagWrap.appendChild(tag);
 });
 cell.appendChild(tagWrap);
 }

 if (entry) {
 cell.style.cursor = 'pointer';
 (function(m, day, e) {
 cell.addEventListener('click', function() { showPopup(m, day, e); });
 })(monthNum, d, entry);
 }

 grid.appendChild(cell);
 }
 grid.style.gridTemplateRows = 'repeat(' + (totalCells / 7) + ', 1fr)';
 }

 function showPopup(month, day, entry) {
 var overlay = document.getElementById('iwcPopupOverlay');
 var date = new Date(2026, month, day);

 document.getElementById('iwcPopupTitle').textContent = MONTHS[month] + ' ' + day + ', 2026';
 document.getElementById('iwcPopupSubtitle').textContent = DAYS_FULL[date.getDay()];

 var bodyHTML = '<div class="iwc-popup-row"><span class="iwc-popup-icon">\u{1F550}</span><div><div class="iwc-popup-label">Park Hours</div><div class="iwc-popup-value">' + entry[2] + '</div></div></div>';

 if (entry[3].length > 0) {
 bodyHTML += '<div class="iwc-popup-row"><span class="iwc-popup-icon">\u{1F389}</span><div><div class="iwc-popup-label">Special Events</div><div class="iwc-popup-events">';
 entry[3].forEach(function(e) {
 var t = EVENT_TYPES[e];
 if (t) bodyHTML += '<span class="iwc-tag ' + t.cls + '" style="font-size:10px;padding:3px 8px;">' + t.emoji + ' ' + t.label + '</span>';
 });
 bodyHTML += '</div></div></div>';
 entry[3].forEach(function(e) {
 var t = EVENT_TYPES[e];
 if (t && t.desc) {
 bodyHTML += '<div class="iwc-popup-row" style="margin-left:30px;"><div><div class="iwc-popup-value" style="font-size:12px;font-weight:500;color:#64748B;">' + t.desc + '</div></div></div>';
 }
 });
 }

 if (entry[4] && entry[4].note) {
 bodyHTML += '<div class="iwc-popup-row"><span class="iwc-popup-icon">\u{1F4CB}</span><div><div class="iwc-popup-label">Details</div><div class="iwc-popup-value" style="font-size:13px;">' + entry[4].note + '</div></div></div>';
 }

 document.getElementById('iwcPopupBody').innerHTML = bodyHTML;

 var mm = String(month + 1).padStart(2, '0');
 var dd = String(day).padStart(2, '0');
 selectedCalDate = {
 iso: '2026-' + mm + '-' + dd,
 label: MONTHS[month] + ' ' + day + ', 2026',
 month: month,
 day: day
 };

 document.getElementById('iwcBuyBtn').style.display = 'block';

 /* Show/hide 2-for-Tuesday button */
 var is2for = entry[3].indexOf('2for') !== -1;
 document.getElementById('iwcBuy2forBtn').style.display = is2for ? 'block' : 'none';

 /* Show/hide After Hours button */
 var afterHoursKey = month + '-' + day;
 var afterHoursRate = AFTER_HOURS_RATES[afterHoursKey];
 document.getElementById('iwcBuyAfterHoursBtn').style.display = afterHoursRate ? 'block' : 'none';

 overlay.classList.add('active');
 }

 function openTicketEngine(root, rate, title) {
 document.getElementById('iwcPopupOverlay').classList.remove('active');
 document.getElementById('iwcTicketTitle').textContent = title;
 var container = document.getElementById('iwcTicketEngine');
 var attrs = 'eid="9f5be16b3a6b913c" root="' + root + '"';
 if (rate) attrs += ' rate="' + rate + '"';
 attrs += ' id="FlatlandWebEngine"';
 container.innerHTML = '<div ' + attrs + '></div>';
 var script = document.createElement('script');
 script.src = 'https://secure.rocket-rez.com/RocketWeb2/assets/scripts/webengine_load.js';
 script.async = true;
 container.appendChild(script);
 document.getElementById('iwcTicketOverlay').classList.add('active');
 }

 /* Buy Tickets (regular admission) */
 document.getElementById('iwcBuyBtn').addEventListener('click', function() {
 if (!selectedCalDate) return;
 openTicketEngine('bNp', '', 'Buy Tickets \u2014 ' + selectedCalDate.label);
 });

 /* 2 for Tuesday */
 document.getElementById('iwcBuy2forBtn').addEventListener('click', function() {
 if (!selectedCalDate) return;
 openTicketEngine('bzY', '', '2 for Tuesday Tickets \u2014 ' + selectedCalDate.label);
 });

 /* After Hours */
 document.getElementById('iwcBuyAfterHoursBtn').addEventListener('click', function() {
 if (!selectedCalDate) return;
 var rate = AFTER_HOURS_RATES[selectedCalDate.month + '-' + selectedCalDate.day] || '';
 openTicketEngine('NBj', rate, 'After Hours Tickets \u2014 ' + selectedCalDate.label);
 });

 document.getElementById('iwcTicketClose').addEventListener('click', function() {
 document.getElementById('iwcTicketOverlay').classList.remove('active');
 });
 document.getElementById('iwcTicketOverlay').addEventListener('click', function(e) {
 if (e.target === e.currentTarget) {
 document.getElementById('iwcTicketOverlay').classList.remove('active');
 }
 });

 document.getElementById('iwcPopupClose').addEventListener('click', function() {
 document.getElementById('iwcPopupOverlay').classList.remove('active');
 });
 document.getElementById('iwcPopupOverlay').addEventListener('click', function(e) {
 if (e.target === e.currentTarget) document.getElementById('iwcPopupOverlay').classList.remove('active');
 });

 document.getElementById('iwcPrevBtn').addEventListener('click', function() {
 if (currentMonthIdx > 0) { currentMonthIdx--; renderMonth(SEASON_MONTHS[currentMonthIdx], 'right'); }
 });
 document.getElementById('iwcNextBtn').addEventListener('click', function() {
 if (currentMonthIdx < SEASON_MONTHS.length - 1) { currentMonthIdx++; renderMonth(SEASON_MONTHS[currentMonthIdx], 'left'); }
 });

 var touchStartX = 0, touchStartY = 0;
 var wrap = document.getElementById('iwcSheetWrap');
 wrap.addEventListener('touchstart', function(e) {
 touchStartX = e.touches[0].clientX;
 touchStartY = e.touches[0].clientY;
 }, { passive: true });
 wrap.addEventListener('touchend', function(e) {
 var dx = e.changedTouches[0].clientX - touchStartX;
 var dy = e.changedTouches[0].clientY - touchStartY;
 if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
 if (dx < 0 && currentMonthIdx < SEASON_MONTHS.length - 1) { currentMonthIdx++; renderMonth(SEASON_MONTHS[currentMonthIdx], 'left'); }
 else if (dx > 0 && currentMonthIdx > 0) { currentMonthIdx--; renderMonth(SEASON_MONTHS[currentMonthIdx], 'right'); }
 }
 }, { passive: true });

 document.addEventListener('keydown', function(e) {
 if (document.getElementById('iwcTicketOverlay').classList.contains('active')) {
 if (e.key === 'Escape') document.getElementById('iwcTicketOverlay').classList.remove('active');
 return;
 }
 if (document.getElementById('iwcPopupOverlay').classList.contains('active')) {
 if (e.key === 'Escape') document.getElementById('iwcPopupOverlay').classList.remove('active');
 return;
 }
 if (e.key === 'ArrowLeft' && currentMonthIdx > 0) { currentMonthIdx--; renderMonth(SEASON_MONTHS[currentMonthIdx], 'right'); }
 if (e.key === 'ArrowRight' && currentMonthIdx < SEASON_MONTHS.length - 1) { currentMonthIdx++; renderMonth(SEASON_MONTHS[currentMonthIdx], 'left'); }
 });

 var dotsEl = document.getElementById('iwcNavDots');
 SEASON_MONTHS.forEach(function(m, i) {
 var dot = document.createElement('div');
 dot.className = 'iwc-nav-dot';
 dot.addEventListener('click', function() {
 var dir = i > currentMonthIdx ? 'left' : i < currentMonthIdx ? 'right' : null;
 currentMonthIdx = i;
 renderMonth(SEASON_MONTHS[i], dir);
 });
 dotsEl.appendChild(dot);
 });

 function showWelcome() {
 var seen = false;
 try { seen = localStorage.getItem('iwcCalendarWelcomeSeen') === '1'; } catch(e) {}
 if (seen) return;

 var overlay = document.createElement('div');
 overlay.id = 'iwcWelcomeOverlay';
 overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.85);z-index:1000001;display:flex;align-items:center;justify-content:center;padding:20px;';

 overlay.innerHTML = '<div style="background:#fff;border-radius:16px;max-width:480px;width:100%;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;">'
 + '<div style="font-size:40px;margin-bottom:12px;">\u{1F5D3}\uFE0F</div>'
 + '<h2 style="font-size:22px;font-weight:800;color:#1E293B;margin:0 0 16px;font-family:Inter,sans-serif;">Welcome to the Event Calendar</h2>'
 + '<div style="text-align:left;font-size:14px;color:#475569;line-height:1.7;font-family:Inter,sans-serif;">'
 + '<p style="margin:0 0 12px;"><strong>Step 1:</strong> Use the arrows or swipe to browse through the months of the 2026 season (May through September).</p>'
 + '<p style="margin:0 0 12px;"><strong>Step 2:</strong> Tap any open day to see park hours, special events, and details for that date.</p>'
 + '<p style="margin:0 0 12px;"><strong>Step 3:</strong> Click the <strong>"\u{1F3AB}\uFE0F Buy Tickets"</strong> button to purchase admission for that day.</p>'
 + '<p style="margin:0 0 12px;"><strong>Color Tags:</strong> Each day shows colored tags for special events \u2014 <span style="background:#DBEAFE;color:#1D4ED8;padding:1px 6px;border-radius:3px;font-size:12px;font-weight:700;">2 for Tues</span> <span style="background:#D1FAE5;color:#047857;padding:1px 6px;border-radius:3px;font-size:12px;font-weight:700;">Wavy Wed</span> <span style="background:#FDE68A;color:#92400E;padding:1px 6px;border-radius:3px;font-size:12px;font-weight:700;">Family Night</span> and more.</p>'
 + '<p style="margin:0;"><strong>Tip:</strong> Days marked <span style="color:#CBD5E1;font-weight:600;">CLOSED</span> are not available for visits.</p>'
 + '</div>'
 + '<button id="iwcWelcomeBtn" style="margin-top:20px;padding:14px 40px;background:#0EA5E9;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;transition:background 0.2s;">Got It, Let\'s Go!</button>'
 + '</div>';

 document.getElementById('iwp-calendar').appendChild(overlay);

 document.getElementById('iwcWelcomeBtn').addEventListener('click', function() {
 overlay.remove();
 try { localStorage.setItem('iwcCalendarWelcomeSeen', '1'); } catch(e) {}
 });
 }

 currentMonthIdx = getInitialMonth();
 renderMonth(SEASON_MONTHS[currentMonthIdx], null);
 showWelcome();
})();
</script>
