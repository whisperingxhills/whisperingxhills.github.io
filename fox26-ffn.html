<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOX26 Night - Fresno Fright Nights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; padding: 0; background: #fff; }
body { padding: 24px 16px; }

#fox26-landing { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; max-width: 960px; margin: 0 auto; color: #1E293B; }
#fox26-landing * { box-sizing: border-box; margin: 0; padding: 0; }

#fox26-landing .fox-promo-box {
  background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
  border-radius: 16px 16px 0 0;
  padding: 28px 24px 24px;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
}
#fox26-landing .fox-promo-box::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 180px; height: 180px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
}

#fox26-landing .fox-badge {
  display: inline-block;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 14px;
}

#fox26-landing .fox-title {
  font-size: 24px;
  font-weight: 800;
  line-height: 1.3;
  margin-bottom: 4px;
  color: #fff;
}

#fox26-landing .fox-price {
  font-size: 48px;
  font-weight: 900;
  color: #38BDF8;
  margin: 8px 0;
}

#fox26-landing .fox-price span {
  font-size: 18px;
  font-weight: 600;
  color: rgba(255,255,255,0.6);
}

#fox26-landing .fox-subtitle {
  font-size: 14px;
  color: rgba(255,255,255,0.8);
  line-height: 1.5;
}

#fox26-landing .fox-steps {
  background: #F8FAFC;
  border-left: 1px solid #E2E8F0;
  border-right: 1px solid #E2E8F0;
  padding: 20px 24px;
}

#fox26-landing .fox-steps-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #64748B;
  margin-bottom: 14px;
}

#fox26-landing .fox-step {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
#fox26-landing .fox-step:last-child { margin-bottom: 0; }

#fox26-landing .fox-step-num {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border-radius: 50%;
  background: #0EA5E9;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

#fox26-landing .fox-step-text {
  font-size: 14px;
  color: #334155;
  line-height: 1.6;
  padding-top: 3px;
}

#fox26-landing .fox-engine-wrap {
  border: 1px solid #E2E8F0;
  border-top: none;
  border-radius: 0 0 16px 16px;
  overflow: hidden;
  background: #fff;
  min-height: 500px;
}

#fox26-landing .fox-fine-print {
  text-align: center;
  font-size: 11px;
  color: #94A3B8;
  padding: 12px 16px 0;
  line-height: 1.5;
}

@media (max-width: 640px) {
  #fox26-landing .fox-promo-box { padding: 22px 16px 20px; }
  #fox26-landing .fox-title { font-size: 20px; }
  #fox26-landing .fox-price { font-size: 40px; }
  #fox26-landing .fox-subtitle { font-size: 13px; }
  #fox26-landing .fox-steps { padding: 16px; }
  #fox26-landing .fox-step-text { font-size: 13px; }
}
</style>
</head>
<body>

<div id="fox26-landing">
  <div class="fox-promo-box">
    <div class="fox-badge">FOX26 &times; Fresno Fright Nights</div>
    <h2 class="fox-title">Exclusive Ticket Offer</h2>
    <div class="fox-price">$26 <span>/ ticket</span></div>
    <p class="fox-subtitle">Valid for <strong>[DATE]</strong> only</p>
  </div>

  <div class="fox-steps">
    <div class="fox-steps-title">How It Works</div>
    <div class="fox-step">
      <div class="fox-step-num">1</div>
      <div class="fox-step-text">Choose your date and select the number of tickets below.</div>
    </div>
    <div class="fox-step">
      <div class="fox-step-num">2</div>
      <div class="fox-step-text">Complete checkout. That's it!</div>
    </div>
    <div class="fox-step">
      <div class="fox-step-num">3</div>
      <div class="fox-step-text">Show up and get haunted. See you in the dark. 🎃</div>
    </div>
  </div>

  <div class="fox-engine-wrap">
    <div eid="REPLACE_WITH_FFN_EVENT_ID" id="FlatlandWebEngine"></div>
    <script type="text/javascript" src="https://secure.rocket-rez.com/RocketWeb2/assets/scripts/webengine_load.js" async></script>
  </div>

  <p class="fox-fine-print">Exclusive offer through FOX26. Valid for [DATE] only.</p>
</div>

</body>
</html>
