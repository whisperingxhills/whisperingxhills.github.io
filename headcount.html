<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Island Waterpark — Headcount Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0a0e1a; color: #e0e6f0; min-height: 100vh; }

.header { background: linear-gradient(135deg, #0f1629, #1a2342); padding: 20px 30px; border-bottom: 1px solid #2a3a5c; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 22px; font-weight: 700; color: #fff; }
.header h1 span { color: #3b82f6; }
.header-right { display: flex; gap: 16px; align-items: center; }
.live-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; display: inline-block; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.last-update { font-size: 12px; color: #64748b; }
.refresh-btn { background: #1e3a5f; border: 1px solid #2a4a6f; color: #93c5fd; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.refresh-btn:hover { background: #264a6f; }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* Today's Hero Card */
.today-hero { background: linear-gradient(135deg, #1a2342, #1e3050); border: 1px solid #2a3a5c; border-radius: 16px; padding: 32px; margin-bottom: 24px; text-align: center; }
.today-hero .date-label { font-size: 14px; color: #64748b; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
.today-hero .date { font-size: 20px; color: #93c5fd; margin-bottom: 24px; }
.today-hero .big-number { font-size: 96px; font-weight: 800; color: #fff; line-height: 1; }
.today-hero .big-label { font-size: 16px; color: #64748b; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }

.today-stats { display: flex; justify-content: center; gap: 48px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #2a3a5c; }
.today-stat { text-align: center; }
.today-stat .val { font-size: 32px; font-weight: 700; }
.today-stat .lbl { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
.val-reserved { color: #f59e0b; }
.val-checked { color: #22c55e; }
.val-available { color: #3b82f6; }
.val-max { color: #94a3b8; }

/* Capacity Bar */
.capacity-bar-container { margin-top: 24px; }
.capacity-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-bottom: 6px; }
.capacity-bar { height: 24px; background: #1a2342; border-radius: 12px; overflow: hidden; position: relative; display: flex; }
.capacity-fill-checked { background: linear-gradient(90deg, #16a34a, #22c55e); transition: width 0.8s ease; border-radius: 12px 0 0 12px; }
.capacity-fill-reserved { background: linear-gradient(90deg, #d97706, #f59e0b); transition: width 0.8s ease; }
.capacity-pct { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; color: #fff; }

/* Weekly Grid */
.week-section { margin-top: 32px; }
.week-section h2 { font-size: 16px; color: #94a3b8; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
.week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.day-card { background: #141b2d; border: 1px solid #2a3a5c; border-radius: 12px; padding: 16px; text-align: center; transition: border-color 0.2s; }
.day-card:hover { border-color: #3b82f6; }
.day-card.today { border-color: #3b82f6; background: #1a2342; }
.day-card .day-name { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
.day-card .day-date { font-size: 14px; color: #93c5fd; margin: 4px 0 12px; }
.day-card .day-count { font-size: 36px; font-weight: 800; color: #fff; }
.day-card .day-count-label { font-size: 10px; color: #64748b; text-transform: uppercase; margin-top: 2px; }
.day-card .day-bar { height: 6px; background: #1a2342; border-radius: 3px; overflow: hidden; margin-top: 12px; display: flex; }
.day-card .day-bar-fill { background: #22c55e; border-radius: 3px; transition: width 0.8s; }
.day-card .day-bar-reserved { background: #f59e0b; transition: width 0.8s; }
.day-card .day-details { font-size: 11px; color: #64748b; margin-top: 8px; display: flex; justify-content: space-between; }

.hours { font-size: 13px; color: #64748b; margin-top: 4px; }

/* Loading */
.loading { text-align: center; padding: 60px; color: #64748b; font-size: 16px; }
.error { background: #3b1219; border: 1px solid #7f1d1d; color: #fca5a5; padding: 16px; border-radius: 8px; margin: 16px 0; }

/* Environment selector */
.env-toggle { display: flex; gap: 4px; background: #0f1629; border-radius: 8px; padding: 4px; }
.env-btn { padding: 6px 14px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; color: #64748b; background: transparent; }
.env-btn.active { background: #1e3a5f; color: #93c5fd; }

/* Prepaid passes banner */
.prepaid-banner { background: linear-gradient(135deg, #1a2342, #1e2d50); border: 1px solid #2a3a5c; border-radius: 12px; padding: 16px 24px; margin-bottom: 16px; display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 12px; }
.prepaid-item { text-align: center; min-width: 120px; }
.prepaid-item .pp-num { font-size: 28px; font-weight: 800; }
.prepaid-item .pp-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
.pp-tft { color: #f59e0b; }
.pp-ww { color: #22c55e; }
.pp-fn { color: #a78bfa; }
.pp-total { color: #fff; }
.prepaid-title { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; width: 100%; text-align: center; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>🏝️ Island <span>Waterpark</span> — Headcount</h1>
  <div class="header-right">

    <span class="live-dot"></span>
    <span class="last-update" id="lastUpdate">Loading...</span>
    <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
  </div>
</div>

<div class="container">
  <div id="prepaidBanner" class="prepaid-banner" style="display:none;"></div>
  <div id="todayHero" class="today-hero">
    <div class="loading">Loading headcount data...</div>
  </div>
  <div class="week-section">
    <h2>This Week</h2>
    <div class="week-grid" id="weekGrid"></div>
  </div>
  <div class="week-section" style="margin-top:24px;">
    <h2>Next Week</h2>
    <div class="week-grid" id="nextWeekGrid"></div>
  </div>
</div>

<script>
const API_BASE = 'https://api.whisperingxhills.com/api/headcount';

async function getSchedule(startDate, endDate) {
  const resp = await fetch(`${API_BASE}?startDate=${startDate}&endDate=${endDate}`);
  if (!resp.ok) throw new Error(`API returned ${resp.status}`);
  const data = await resp.json();
  return data.data || [];
}

function formatDate(d) {
  // Force Pacific time so API date matches what the user sees
  const parts = d.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' }).split('-');
  return parts.join('-');
}

function getDayName(d) {
  return d.toLocaleDateString('en-US', { weekday: 'short' });
}

function getDisplayDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function getFullDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function renderToday(dayData) {
  const hero = document.getElementById('todayHero');
  
  if (!dayData || !dayData.schedules || !dayData.schedules.length) {
    hero.innerHTML = `
      <div class="date-label">Today</div>
      <div class="date">${getFullDate(new Date())}</div>
      <div class="big-number" style="font-size:48px;color:#64748b;">CLOSED</div>
      <div class="big-label">No schedule configured</div>
    `;
    return;
  }

  const s = dayData.schedules[0];
  const checkedIn = s.checkedIn || 0;
  const reserved = s.reserved || 0;
  const max = s.maxOccupancy || 1;
  const available = s.available || 0;
  const pctChecked = Math.round((checkedIn / max) * 100);
  const pctReserved = Math.round(((reserved - checkedIn) / max) * 100);
  const pctTotal = Math.round((reserved / max) * 100);

  hero.innerHTML = `
    <div class="date-label">Today</div>
    <div class="date">${getFullDate(new Date())}</div>
    <div class="big-number">${checkedIn.toLocaleString()}</div>
    <div class="big-label">Checked In</div>
    <div class="today-stats">
      <div class="today-stat"><div class="val val-reserved">${reserved.toLocaleString()}</div><div class="lbl">Reserved</div></div>
      <div class="today-stat"><div class="val val-available">${available.toLocaleString()}</div><div class="lbl">Available</div></div>
      <div class="today-stat"><div class="val val-max">${max.toLocaleString()}</div><div class="lbl">Max Capacity</div></div>
    </div>
    <div class="capacity-bar-container">
      <div class="capacity-bar-label">
        <span>${s.startTime} — ${s.endTime}</span>
        <span>${pctTotal}% of capacity</span>
      </div>
      <div class="capacity-bar">
        <div class="capacity-fill-checked" style="width:${pctChecked}%"></div>
        <div class="capacity-fill-reserved" style="width:${Math.max(0, pctReserved)}%"></div>
        <span class="capacity-pct">${pctTotal}%</span>
      </div>
    </div>
    <div class="hours">${s.startTime} — ${s.endTime}</div>
  `;
}

function renderWeek(days, containerId, todayStr) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';

  days.forEach(dayData => {
    const card = document.createElement('div');
    card.className = 'day-card' + (dayData.dateStr === todayStr ? ' today' : '');
    
    const d = new Date(dayData.dateStr + 'T12:00:00');
    
    if (!dayData.schedules || !dayData.schedules.length) {
      card.innerHTML = `
        <div class="day-name">${getDayName(d)}</div>
        <div class="day-date">${getDisplayDate(d)}</div>
        <div class="day-count" style="font-size:20px;color:#475569;">CLOSED</div>
        <div class="day-count-label">No schedule</div>
      `;
    } else {
      const s = dayData.schedules[0];
      const checkedIn = s.checkedIn || 0;
      const reserved = s.reserved || 0;
      const max = s.maxOccupancy || 1;
      const pctChecked = (checkedIn / max) * 100;
      const pctReserved = ((reserved - checkedIn) / max) * 100;
      const displayNum = checkedIn > 0 ? checkedIn : reserved;
      const displayLabel = checkedIn > 0 ? 'Checked In' : 'Reserved';

      card.innerHTML = `
        <div class="day-name">${getDayName(d)}</div>
        <div class="day-date">${getDisplayDate(d)}</div>
        <div class="day-count">${displayNum.toLocaleString()}</div>
        <div class="day-count-label">${displayLabel}</div>
        <div class="day-bar">
          <div class="day-bar-fill" style="width:${pctChecked}%"></div>
          <div class="day-bar-reserved" style="width:${Math.max(0, pctReserved)}%"></div>
        </div>
        <div class="day-details">
          <span>📋 ${reserved}</span>
          <span>✅ ${checkedIn}</span>
          <span>🏷️ ${max}</span>
        </div>
      `;
    }
    grid.appendChild(card);
  });
}

async function loadDashboard() {
  const now = new Date();
  const todayStr = formatDate(now);
  
  // Get this week (Mon-Sun)
  const dayOfWeek = now.getDay();
  const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  
  // Next week
  const nextMonday = new Date(sunday);
  nextMonday.setDate(sunday.getDate() + 1);
  const nextSunday = new Date(nextMonday);
  nextSunday.setDate(nextMonday.getDate() + 6);

  try {
    const [thisWeekData, nextWeekData] = await Promise.all([
      getSchedule(formatDate(monday), formatDate(sunday)),
      getSchedule(formatDate(nextMonday), formatDate(nextSunday))
    ]);

    // Build day map
    const dayMap = {};
    [...thisWeekData, ...nextWeekData].forEach(d => {
      dayMap[d.date] = d;
    });

    // Render today
    renderToday(dayMap[todayStr] || null);

    // Render this week
    const thisWeekDays = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const ds = formatDate(d);
      thisWeekDays.push({ dateStr: ds, schedules: dayMap[ds]?.schedules || [] });
    }
    renderWeek(thisWeekDays, 'weekGrid', todayStr);

    // Render next week
    const nextWeekDays = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(nextMonday);
      d.setDate(nextMonday.getDate() + i);
      const ds = formatDate(d);
      nextWeekDays.push({ dateStr: ds, schedules: dayMap[ds]?.schedules || [] });
    }
    renderWeek(nextWeekDays, 'nextWeekGrid', todayStr);

    document.getElementById('lastUpdate').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    document.getElementById('todayHero').innerHTML = `<div class="error">Error loading data: ${e.message}<br>Check console for details.</div>`;
    console.error(e);
  }
}

async function loadPrepaidPasses() {
  try {
    const resp = await fetch('https://api.whisperingxhills.com/api/prepaid-passes');
    if (!resp.ok) return;
    const data = await resp.json();
    const banner = document.getElementById('prepaidBanner');
    banner.style.display = 'flex';
    banner.innerHTML = `
      <div class="prepaid-title">Active Prepaid Passes (Unredeemed)</div>
      <div class="prepaid-item"><div class="pp-num pp-tft">${data.twoForTuesday}</div><div class="pp-label">Two for Tuesday</div></div>
      <div class="prepaid-item"><div class="pp-num pp-ww">${data.wavyWednesday}</div><div class="pp-label">Wavy Wednesday</div></div>
      <div class="prepaid-item"><div class="pp-num pp-fn">${data.familyNight}</div><div class="pp-label">Family Night</div></div>
      <div class="prepaid-item"><div class="pp-num pp-total">${data.total}</div><div class="pp-label">Total Passes</div></div>
    `;
  } catch(e) {
    console.error('Prepaid passes error:', e);
  }
}

// Auto refresh every 60 seconds
loadDashboard();
loadPrepaidPasses();
setInterval(loadDashboard, 60000);
setInterval(loadPrepaidPasses, 300000); // refresh passes every 5 min (heavy query)
</script>
</body>
</html>
