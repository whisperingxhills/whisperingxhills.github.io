<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FFN Sales Dashboard</title>
<style>
  :root{--bg:#0A0708;--panel:#15100E;--panel2:#1C1512;--line:#2C211C;
    --ink:#F2E9E2;--dim:#9C8F85;--faint:#6B5D56;
    --orange:#E8611A;--green:#3FA66A;--red:#C4452F;--amber:#D99A2B;--blue:#5A8FB8;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:18px 14px 50px;}
  .wrap{max-width:1180px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;
    border-bottom:3px solid var(--orange);padding-bottom:10px;margin-bottom:18px}
  h1{font-size:21px;margin:0;letter-spacing:.5px;text-transform:uppercase}
  .spacer{flex:1}
  .sub{color:var(--dim);font-size:12px}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:7px 13px;font-size:12px;cursor:pointer}
  button:hover{background:#271d18}
  button.on{background:var(--orange);color:#140C07;border-color:var(--orange)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .card .lab{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px}
  .card .val{font-size:24px;font-weight:700;margin-top:5px;line-height:1.1}
  .card .note{color:var(--faint);font-size:10.5px;margin-top:3px}
  .accent{color:var(--orange)}

  h2{font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    margin:26px 0 9px;border-bottom:1px solid var(--line);padding-bottom:6px;
    display:flex;align-items:center;gap:10px}
  h2 .hint{text-transform:none;letter-spacing:0;color:var(--faint);font-size:11px;font-weight:400}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.6px;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  td{padding:8px 9px;border-bottom:1px solid #191311;vertical-align:middle}
  tr:hover td{background:#17110F}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .past{color:var(--faint)}
  .today td{background:#201510}
  .today .d{color:var(--orange);font-weight:700}
  tfoot td{border-top:2px solid var(--line);border-bottom:none;font-weight:700;padding-top:9px}

  .bar{height:7px;background:#241A16;border-radius:4px;overflow:hidden;min-width:50px}
  .bar i{display:block;height:100%;background:var(--orange)}
  .bar i.comp{background:var(--blue)}
  .barsplit{display:flex;height:7px;background:#241A16;border-radius:4px;overflow:hidden;min-width:50px}
  .barsplit i{display:block;height:100%}
  .barsplit .p{background:var(--orange)} .barsplit .c{background:#3C5A70}

  .tag{font-size:9px;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;
    text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .t-today{background:var(--orange);color:#140C07}
  .t-low{background:#3A1E18;color:#E88A72}
  .t-ext{background:#1E2E3A;color:#8FBEDC}

  .pill{font-size:9px;padding:2px 7px;border-radius:9px;text-transform:uppercase;letter-spacing:.5px}
  .c-admission{background:#3A2410;color:#F0A867}
  .c-merch{background:#2A1E38;color:#B89BD9}
  .c-addon{background:#13302A;color:#6FC9A8}
  .c-fnb{background:#36301A;color:#D9C46B}
  .c-other{background:#2A2320;color:#A89488}
  .c-waiver{background:#201A30;color:#8E86C4}

  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:12px;margin-bottom:6px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .pcard h3{margin:0 0 3px;font-size:13.5px;letter-spacing:.3px}
  .pcard .pr{color:var(--orange);font-size:19px;font-weight:700}
  .pcard .pm{color:var(--dim);font-size:11px;margin-top:2px}
  .pcard .pl{margin-top:9px;border-top:1px solid var(--line);padding-top:7px}
  .pcard .pl div{display:flex;justify-content:space-between;gap:9px;font-size:11px;
                 color:var(--faint);padding:2px 0}
  .pcard .pl div span:last-child{white-space:nowrap;color:var(--dim)}
  .alt{display:inline-block;background:#1E2A33;color:#8FBEDC;font-size:9px;padding:2px 6px;
       border-radius:4px;letter-spacing:.4px;text-transform:uppercase;margin-left:6px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media(max-width:860px){.two{grid-template-columns:1fr}}
  .scroll{max-height:none}

  .foot{color:var(--faint);font-size:11px;margin-top:30px;line-height:1.65;
    border-top:1px solid var(--line);padding-top:13px}
  .foot strong{color:var(--dim)}
  .err{background:#2A1512;border:1px solid var(--red);color:#F0B5A8;
    padding:11px 13px;border-radius:8px;margin-bottom:16px;font-size:13px}
  .loading{color:var(--dim);padding:40px 0;text-align:center}
  .warn{background:#2A2110;border:1px solid #6B5320;color:#E0C07A;
    padding:9px 12px;border-radius:7px;font-size:12px;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fresno Fright Nights <span class="accent">Sales</span></h1>
    <div class="spacer"></div>
    <span class="sub" id="stamp">loading…</span>
    <button id="refresh">Refresh</button>
  </header>
  <div id="err"></div>
  <div id="body"><div class="loading">Pulling from RocketRez…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const API='https://casting.whisperingxhills.com/api/ffn-sales';
const $=s=>document.querySelector(s);
const m0=n=>'$'+(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const m2=n=>'$'+(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const todayISO=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
const dow=i=>new Date(i+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'});
const pretty=i=>new Date(i+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA=null, psort={k:'rev',dir:-1};

function render(d){
  DATA=d;
  const T=d.totals, C=d.categories, today=todayISO();
  const dates=Object.keys(d.byDate).filter(x=>d.byDate[x].admits>0).sort();
  const upcoming=dates.filter(x=>x>=today);
  const maxAd=Math.max(1,...dates.map(x=>d.byDate[x].admits));
  const avg=T.admits?T.admissionRevenue/T.admits:0;
  const futA=upcoming.reduce((s,x)=>s+d.byDate[x].admits,0);
  const futR=upcoming.reduce((s,x)=>s+d.byDate[x].rev,0);
  const totalComp=dates.reduce((s,x)=>s+d.byDate[x].comp,0);
  const totalPaid=dates.reduce((s,x)=>s+d.byDate[x].paid,0);

  let h=`<div class="cards">
   <div class="card"><div class="lab">Gross Revenue</div><div class="val accent">${m0(T.grossRevenue)}</div>
     <div class="note">${d.orders.transactions} transactions</div></div>
   <div class="card"><div class="lab">Admissions</div><div class="val">${T.admits.toLocaleString()}</div>
     <div class="note">${totalPaid} paid · ${totalComp} comp</div></div>
   <div class="card"><div class="lab">Ticket Revenue</div><div class="val">${m0(T.admissionRevenue)}</div>
     <div class="note">${m2(avg)} avg per admit</div></div>
   <div class="card"><div class="lab">Still To Come</div><div class="val">${futA.toLocaleString()}</div>
     <div class="note">${m0(futR)} · ${upcoming.length} night${upcoming.length===1?'':'s'} left</div></div>
   <div class="card"><div class="lab">Merch</div><div class="val">${m0(C.merch.rev)}</div>
     <div class="note">${C.merch.qty} items</div></div>
   <div class="card"><div class="lab">Add-ons</div><div class="val">${m0(C.addon.rev)}</div>
     <div class="note">${C.addon.qty} sold</div></div>
   <div class="card"><div class="lab">Food &amp; Bev</div><div class="val">${m0(C.fnb.rev)}</div>
     <div class="note">${C.fnb.qty} items</div></div>
   <div class="card"><div class="lab">Other</div><div class="val">${m0(C.other.rev)}</div>
     <div class="note">${C.other.qty} items</div></div>
  </div>`;

  /* ---- BY NIGHT ---- */
  h+=`<h2>Every Night <span class="hint">orange = paid · blue = comp/redemption</span></h2>
   <table><thead><tr><th>Date</th><th>Day</th><th class="num">Paid</th><th class="num">Comp</th>
   <th class="num">Total</th><th style="width:22%"></th><th class="num">Revenue</th>
   <th class="num">Avg paid</th></tr></thead><tbody>`;
  let sP=0,sC=0,sA=0,sR=0;
  for(const iso of dates){
    const b=d.byDate[iso], isT=iso===today, isP=iso<today;
    const avgPaid=b.paid?b.rev/b.paid:0;
    sP+=b.paid; sC+=b.comp; sA+=b.admits; sR+=b.rev;
    let tag='';
    if(isT) tag='<span class="tag t-today">tonight</span>';
    else if(!isP&&b.admits<25) tag='<span class="tag t-low">thin</span>';
    if(iso==='2026-10-16') tag+='<span class="tag t-ext">KLIN</span>';
    const pw=Math.round(100*b.paid/maxAd), cw=Math.round(100*b.comp/maxAd);
    h+=`<tr class="${isT?'today':''}">
      <td class="d ${isP?'past':''}">${pretty(iso)}${tag}</td>
      <td class="${isP?'past':''}">${dow(iso)}</td>
      <td class="num">${b.paid.toLocaleString()}</td>
      <td class="num ${b.comp?'':'past'}">${b.comp?b.comp.toLocaleString():'—'}</td>
      <td class="num">${b.admits.toLocaleString()}</td>
      <td><div class="barsplit"><i class="p" style="width:${pw}%"></i><i class="c" style="width:${cw}%"></i></div></td>
      <td class="num">${m0(b.rev)}</td>
      <td class="num ${isP?'past':''}">${b.paid?m2(avgPaid):'—'}</td></tr>`;
  }
  h+=`</tbody><tfoot><tr><td colspan="2">TOTAL · ${dates.length} nights</td>
    <td class="num">${sP.toLocaleString()}</td><td class="num">${sC.toLocaleString()}</td>
    <td class="num">${sA.toLocaleString()}</td><td></td><td class="num">${m0(sR)}</td>
    <td class="num">${sP?m2(sR/sP):'—'}</td></tr></tfoot></table>`;

  /* ---- CHANNEL + CATEGORY ---- */
  h+=`<div class="two"><div><h2>Channel <span class="hint">admissions only</span></h2>
    <table><thead><tr><th>Source</th><th class="num">Admits</th><th class="num">Revenue</th>
    <th class="num">Avg</th></tr></thead><tbody>`;
  Object.entries(d.byChannel).sort((a,b)=>b[1].rev-a[1].rev).forEach(([k,v])=>{
    h+=`<tr><td>${esc(k)}</td><td class="num">${v.qty.toLocaleString()}</td>
      <td class="num">${m0(v.rev)}</td><td class="num">${v.qty?m2(v.rev/v.qty):'—'}</td></tr>`;});
  h+=`</tbody></table></div>`;

  h+=`<div><h2>Revenue by Category</h2><table><thead><tr><th>Category</th>
    <th class="num">Qty</th><th class="num">Revenue</th></tr></thead><tbody>`;
  const order=['admission','addon','merch','fnb','other','waiver'];
  const label={admission:'Admissions',addon:'Add-ons',merch:'Merch',fnb:'Food & Bev',
               other:'Other / uncategorised',waiver:'Waiver records'};
  order.forEach(k=>{const v=C[k]; if(!v) return;
    h+=`<tr><td><span class="pill c-${k}">${label[k]}</span></td>
      <td class="num">${v.qty.toLocaleString()}</td>
      <td class="num">${v.rev?m0(v.rev):'$0'}</td></tr>`;});
  h+=`</tbody></table>
    <div class="warn">Waiver records are signed-waiver entries, not a product.
    They always total $0. 148 orders this season contain nothing but a waiver.</div>
    </div></div>`;

  /* ---- CONSIGNMENT / PARTNERS ---- */
  const P=d.partners||{};
  const pk=Object.keys(P).sort((a,b)=>(P[b].used||0)-(P[a].used||0));
  if(pk.length){
    const totUsed=pk.reduce((s,k)=>s+P[k].used,0);
    const totRev=pk.reduce((s,k)=>s+P[k].rev,0);
    const totAll=pk.reduce((s,k)=>s+P[k].allotted,0);
    h+=`<h2>Consignment &amp; Partner Tickets
      <span class="hint">${pk.length} sources · ${totUsed.toLocaleString()} tickets moved · ${m0(totRev)}</span></h2>
      <div class="pgrid">`;
    for(const k of pk){
      const v=P[k];
      h+=`<div class="pcard"><h3>${esc(k)}${v.allotted?`<span class="alt">${v.allotted.toLocaleString()} allotted</span>`:''}</h3>
        <div class="pr">${v.used.toLocaleString()} <span style="font-size:12px;color:var(--dim)">tickets</span></div>
        <div class="pm">${v.rev?m0(v.rev)+' revenue · '+m2(v.rev/v.used)+' each':'no ticket revenue (comp / redemption)'}</div>
        <div class="pl">`;
      Object.entries(v.items).sort((a,b)=>b[1].qty-a[1].qty).forEach(([n,i])=>{
        const lbl=esc(n.replace(/\s+/g,' ').trim());
        if(i.qty>0) h+=`<div><span>${lbl}</span><span>${i.qty.toLocaleString()} · ${i.rev?m0(i.rev):'$0'}</span></div>`;
        else if(i.allot>0) h+=`<div><span>${lbl}</span><span style="color:#5A8FB8">${i.allot.toLocaleString()} loaded, 0 used</span></div>`;
      });
      const dk=Object.keys(v.dates||{}).sort();
      if(dk.length) h+=`<div style="margin-top:5px;border-top:1px solid #241A16;padding-top:5px">
        <span>nights</span><span>${dk.map(x=>pretty(x)+' ('+v.dates[x]+')').join(', ')}</span></div>`;
      h+=`</div></div>`;
    }
    h+=`</div>`;
    h+=`<table style="margin-top:12px"><thead><tr><th>Source</th>
      <th class="num">Allotted</th><th class="num">Used</th><th class="num">Unused</th>
      <th class="num">Revenue</th><th class="num">Avg</th></tr></thead><tbody id="ptnbody">`;
    for(const k of pk){ const v=P[k];
      const unused = v.allotted ? (v.allotted - v.used) : null;
      h+=`<tr><td>${esc(k)}</td>
        <td class="num ${v.allotted?'':'past'}">${v.allotted?v.allotted.toLocaleString():'—'}</td>
        <td class="num">${v.used.toLocaleString()}</td>
        <td class="num ${unused===null?'past':''}">${unused===null?'—':unused.toLocaleString()}</td>
        <td class="num ${v.rev?'':'past'}">${v.rev?m0(v.rev):'$0'}</td>
        <td class="num ${v.rev?'':'past'}">${v.rev?m2(v.rev/v.used):'—'}</td></tr>`;}
    h+=`</tbody><tfoot><tr><td>TOTAL · ${pk.length} sources</td>
      <td class="num">${totAll.toLocaleString()}</td><td class="num">${totUsed.toLocaleString()}</td>
      <td class="num">${(totAll-totUsed).toLocaleString()}</td>
      <td class="num">${m0(totRev)}</td><td class="num">${totUsed?m2(totRev/totUsed):'—'}</td>
      </tr></tfoot></table>
      <div class="warn">"Allotted" is bulk inventory loaded into RocketRez (Groupon vouchers,
      Boca comps). "Used" is tickets actually sold or redeemed. Sources with no allotment
      number sell straight through our online store under their own product code.</div>`;
  }

  /* ---- SHIPWRECK VIP CABINS ---- */
  (function(){
    const CB=d.cabins;
    if(!CB) return;
    const nights=Object.keys(CB.byNight).sort();
    const allNights=Object.keys(d.byDate).filter(x=>x>='2026-10-01').sort();
    h+=`<h2>Shipwreck VIP Cabins <span class="hint">premium add-on · booked by night</span></h2>
      <div id="cabwrap" class="pgrid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
        <div class="pcard"><h3>Cabins Sold</h3>
          <div class="pr">${CB.total.toLocaleString()}</div>
          <div class="pm">across ${nights.length} night${nights.length===1?'':'s'}</div></div>
        <div class="pcard"><h3>Revenue</h3>
          <div class="pr">${m0(CB.revenue)}</div>
          <div class="pm">${CB.total?m2(CB.revenue/CB.total):'—'} per cabin</div></div>
        <div class="pcard"><h3>Nights With None</h3>
          <div class="pr">${allNights.filter(x=>!CB.byNight[x]).length}</div>
          <div class="pm">of ${allNights.length} October nights</div></div>
      </div>`;

    if(CB.lines.length){
      h+=`<table style="margin-top:12px"><thead><tr>
        <th>Night booked</th><th>Day</th><th class="num">Cabins</th>
        <th class="num">Revenue</th><th>Purchased</th><th>Channel</th>
        </tr></thead><tbody>`;
      CB.lines.forEach(L=>{
        const n=L.night;
        h+=`<tr><td>${n?pretty(n):'<span class="past">no date</span>'}</td>
          <td>${n?dow(n):'—'}</td>
          <td class="num">${L.qty}</td>
          <td class="num">${m0(L.rev)}</td>
          <td>${L.purchased?pretty(L.purchased):'—'}</td>
          <td>${esc(L.channel||'—')}</td></tr>`;
      });
      h+=`</tbody><tfoot><tr><td colspan="2">TOTAL</td>
        <td class="num">${CB.total}</td><td class="num">${m0(CB.revenue)}</td>
        <td colspan="2"></td></tr></tfoot></table>`;
    }

    const empty=allNights.filter(x=>!CB.byNight[x]);
    if(empty.length){
      h+=`<div class="warn">No cabins booked yet for:
        ${empty.map(x=>pretty(x)+' ('+dow(x)+')').join(' · ')}</div>`;
    }
  })();

  /* ---- MESSAGES FROM BEYOND (Seance Experience) ---- */
  (function(){
    const MFB=/s[\u00e9e]ance/i;
    const lines=Object.entries(d.products).filter(([n])=>MFB.test(n));
    if(!lines.length) return;
    const tq=lines.reduce((a,[,v])=>a+v.qty,0);
    const tr=lines.reduce((a,[,v])=>a+v.rev,0);
    const admits=d.totals.admits||1;
    h+=`<h2>Messages From Beyond <span class="hint">Séance Experience · in-park add-on</span></h2>
      <div id="mfbwrap" class="pgrid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
        <div class="pcard"><h3>Tickets Sold</h3>
          <div class="pr">${tq.toLocaleString()}</div>
          <div class="pm">across ${lines.length} sales channel${lines.length===1?'':'s'}</div></div>
        <div class="pcard"><h3>Revenue</h3>
          <div class="pr">${m0(tr)}</div>
          <div class="pm">${tq?m2(tr/tq):'—'} per ticket</div></div>
        <div class="pcard"><h3>Attach Rate</h3>
          <div class="pr">${(100*tq/admits).toFixed(1)}%</div>
          <div class="pm">${tq} of ${admits.toLocaleString()} admissions</div></div>
      </div>
      <table style="margin-top:12px"><thead><tr><th>Channel</th>
      <th class="num">Qty</th><th class="num">Revenue</th><th class="num">Unit</th>
      </tr></thead><tbody>`;
    lines.sort((a,b)=>b[1].rev-a[1].rev).forEach(([n,v])=>{
      h+=`<tr><td>${esc(n.replace(/\s+/g,' ').trim())}</td>
        <td class="num">${v.qty.toLocaleString()}</td>
        <td class="num">${m0(v.rev)}</td>
        <td class="num">${v.qty?m2(v.rev/v.qty):'—'}</td></tr>`;
    });
    h+=`</tbody><tfoot><tr><td>TOTAL</td><td class="num">${tq.toLocaleString()}</td>
      <td class="num">${m0(tr)}</td><td class="num">${tq?m2(tr/tq):'—'}</td></tr></tfoot></table>`;
  })();

  /* ---- ALL PRODUCTS ---- */
  h+=`<h2>Every Product <span class="hint" id="pcount"></span></h2>
    <table id="ptab"><thead><tr>
    <th class="sortable" data-k="name">Product</th>
    <th class="sortable" data-k="cat">Category</th>
    <th class="sortable num" data-k="qty">Qty</th>
    <th class="sortable num" data-k="rev">Revenue</th>
    <th class="sortable num" data-k="unit">Unit</th>
    </tr></thead><tbody id="pbody"></tbody><tfoot id="pfoot"></tfoot></table>`;

  /* ---- ORDER DAY ---- */
  const ods=Object.keys(d.byOrderDay).sort();
  h+=`<h2>Sales Activity <span class="hint">by the day the order was placed</span></h2>
    <table><thead><tr><th>Order date</th><th>Day</th><th class="num">Orders</th>
    <th style="width:34%"></th><th class="num">Revenue</th></tr></thead><tbody>`;
  const maxOR=Math.max(1,...ods.map(x=>d.byOrderDay[x].rev));
  let tOrd=0,tRev=0;
  for(const iso of ods){const b=d.byOrderDay[iso]; tOrd+=b.orders; tRev+=b.rev;
    h+=`<tr><td>${pretty(iso)}</td><td>${dow(iso)}</td>
      <td class="num">${b.orders}</td>
      <td><div class="bar"><i style="width:${Math.round(100*b.rev/maxOR)}%"></i></div></td>
      <td class="num">${m0(b.rev)}</td></tr>`;}
  h+=`</tbody><tfoot><tr><td colspan="2">TOTAL</td><td class="num">${tOrd}</td><td></td>
    <td class="num">${m0(tRev)}</td></tr></tfoot></table>`;

  $('#body').innerHTML=h;
  renderProducts();
  document.querySelectorAll('#ptab th.sortable').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.dataset.k;
      psort = (psort.k===k) ? {k,dir:-psort.dir} : {k,dir:(k==='name'||k==='cat')?1:-1};
      renderProducts();
    });
  });

  const when=new Date(d.cachedAt||d.generatedAt);
  $('#stamp').textContent='updated '+when.toLocaleString('en-US',
    {timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT';

  $('#foot').innerHTML=`
   <strong>Source.</strong> Live RocketRez Orders for Fresno Fright Nights (company 239),
   ${d.seasonStart} to now. Server caches 5 minutes; page re-checks every 5 minutes.<br>
   <strong>Orders.</strong> ${d.orders.total} order records · ${d.orders.transactions} real
   transactions · ${d.orders.waiverOnly} waiver-only records · ${d.orders.voided} voided or
   cancelled (excluded from all figures).<br>
   <strong>Comp vs paid.</strong> "Comp" counts admissions that came through at $0 — season
   pass redemptions, Groupon redemptions, employee and trade admissions. They are real people
   through the gate but carry no ticket revenue.<br>
   <strong>Excluded.</strong> ${T.groupPlaceholdersExcluded.toLocaleString()} Groupon inventory
   placeholder units (bulk rows at $0 with no event date) are stock records, not guests.<br>
   <strong>Consignment.</strong> Partner tickets are identified by product name (Fox 26, Univision, iHeart, Lotus, Jazzy D, Groupon, Discount Tire, Boca). A partner that ever sells under a product name without its own label will not be picked up here.<br>
   <strong>Revenue</strong> is line-item subtotal and excludes fees and tax. Gross is the sum of
   active order totals, so it includes fees.<br>
   <span style="color:#8a6a4a"><strong>Known gaps.</strong> Fresnoween (Oct 16) is sold by KLIN
   Events and those sales never enter this system. Walk-up sales rung without an event date
   attached will not appear in the nightly table, though they do count in gross.</span>`;
}

function renderProducts(){
  const P=DATA.products;
  let rows=Object.entries(P).map(([name,v])=>({name,...v,unit:v.qty?v.rev/v.qty:0}));
  const k=psort.k,dir=psort.dir;
  rows.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(k==='name'||k==='cat'){x=String(x).toLowerCase();y=String(y).toLowerCase();
      return x<y?-dir:x>y?dir:0;}
    return (x-y)*dir;
  });
  const label={admission:'Admission',addon:'Add-on',merch:'Merch',fnb:'F&B',
               other:'Other',waiver:'Waiver'};
  let h='';
  for(const r of rows){
    h+=`<tr><td>${esc(r.name.replace(/\s+/g,' ').trim())}</td>
      <td><span class="pill c-${r.cat}">${label[r.cat]}</span></td>
      <td class="num">${r.qty.toLocaleString()}</td>
      <td class="num ${r.rev?'':'past'}">${r.rev?m0(r.rev):'$0'}</td>
      <td class="num ${r.rev?'':'past'}">${r.rev?m2(r.unit):'—'}</td></tr>`;
  }
  document.getElementById('pbody').innerHTML=h;
  const tq=rows.reduce((s,r)=>s+r.qty,0), tr2=rows.reduce((s,r)=>s+r.rev,0);
  document.getElementById('pfoot').innerHTML=
    `<tr><td colspan="2">TOTAL · ${rows.length} products</td>
     <td class="num">${tq.toLocaleString()}</td><td class="num">${m0(tr2)}</td><td></td></tr>`;
  document.getElementById('pcount').textContent=
    `${rows.length} products, nothing hidden — click any header to sort`;
}

async function load(){
  $('#err').innerHTML='';
  if(!DATA) $('#body').innerHTML='<div class="loading">Pulling from RocketRez…</div>';
  try{
    const r=await fetch(API+'?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.error) throw new Error(d.detail||d.error);
    render(d);
  }catch(e){
    $('#err').innerHTML='<div class="err"><strong>Could not load sales data.</strong><br>'+
      esc(e.message||e)+'<br><span style="color:#b98a7c">Figures below may be stale. '+
      'This does not affect ticket sales.</span></div>';
    if(!DATA) $('#body').innerHTML='';
  }
}
$('#refresh').addEventListener('click',load);
load();
setInterval(load,5*60*1000);
</script>
