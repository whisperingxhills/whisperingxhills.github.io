<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H2 (Hannah Ross) — Schedule 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 22px; font-weight: 700; }
.header p { font-size: 14px; color: #64748b; margin-top: 4px; }
.month-label { font-size: 18px; font-weight: 700; margin: 24px 0 8px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 16px; }
.cal .dow { font-size: 11px; font-weight: 700; text-align: center; padding: 6px 2px; color: #64748b; text-transform: uppercase; }
.cal .day { background: #fff; border-radius: 8px; padding: 8px 4px; text-align: center; min-height: 70px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.cal .day .num { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.cal .day .shift { font-size: 10px; font-weight: 600; color: #059669; line-height: 1.3; }
.cal .day.off { background: #fef2f2; }
.cal .day.off .num { color: #dc2626; }
.cal .day.off .shift { color: #dc2626; font-weight: 700; }
.cal .day.closed { background: #f1f5f9; }
.cal .day.closed .num { color: #94a3b8; }
.cal .day.closed .shift { color: #94a3b8; }
.cal .day.empty { background: transparent; box-shadow: none; }
.cal .day.not-started { background: #f1f5f9; }
.cal .day.not-started .num { color: #94a3b8; }
.cal .day.not-started .shift { color: #94a3b8; }
@media print { body { padding: 0; } .cal .day { min-height: 60px; } }
</style>
</head>
<body>
<div class="header">
  <h1>H2 (Hannah Ross) — 2026 Schedule</h1>
  <p>Island Waterpark — Opening Shift</p>
</div>
<script>
var SCHEDULE = {
  // Starts June 29. Off days: Wed + Sun.
  // Shift: 9:00-3:30 (6 hrs paid + 30 min lunch)
  // JUNE (starts 6/29)
  "6-29":"9:00-3:30","6-30":"9:00-3:30",
  // JULY - Off Wed + Sun
  "7-1":"9:00-3:30","7-2":"OFF","7-3":"9:00-3:30","7-4":"9:00-3:30","7-5":"9:00-3:30",
  "7-6":"OFF","7-7":"9:00-3:30","7-8":"9:00-3:30","7-9":"OFF","7-10":"9:00-3:30","7-11":"9:00-3:30","7-12":"9:00-3:30",
  "7-13":"OFF","7-14":"9:00-3:30","7-15":"9:00-3:30","7-16":"OFF","7-17":"9:00-3:30","7-18":"9:00-3:30","7-19":"9:00-3:30",
  "7-20":"OFF","7-21":"9:00-3:30","7-22":"9:00-3:30","7-23":"OFF","7-24":"9:00-3:30","7-25":"9:00-3:30","7-26":"9:00-3:30",
  "7-27":"OFF","7-28":"9:00-3:30","7-29":"9:00-3:30","7-30":"OFF","7-31":"9:00-3:30",
  // AUGUST
  "8-1":"9:00-3:30","8-2":"9:00-3:30",
  "8-3":"OFF","8-4":"9:00-3:30","8-5":"9:00-3:30","8-6":"OFF","8-7":"9:00-3:30","8-8":"9:00-3:30","8-9":"9:00-3:30",
  "8-10":"OFF","8-11":"9:00-3:30",
  "8-15":"9:00-3:30","8-16":"9:00-3:30",
  "8-22":"9:00-3:30","8-23":"9:00-3:30",
  "8-29":"9:00-3:30","8-30":"9:00-3:30",
  // SEPTEMBER
  "9-5":"9:00-3:30","9-6":"9:00-3:30","9-7":"OFF"
};

var CLOSED_DAYS = ["8-12","8-13","8-14","8-17","8-18","8-19","8-20","8-21","8-24","8-25","8-26","8-27","8-28","8-31","9-1","9-2","9-3","9-4"];
var NOT_STARTED = [];
// June 8-28 she hasn't started yet
for (var d = 8; d <= 28; d++) NOT_STARTED.push("6-"+d);

var MONTHS = [
  {name:"June", year:2026, month:6, startDow:1, days:30},
  {name:"July", year:2026, month:7, startDow:3, days:31},
  {name:"August", year:2026, month:8, startDow:6, days:31},
  {name:"September", year:2026, month:9, startDow:2, days:30}
];
var DOWS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

MONTHS.forEach(function(m){
  var label = document.createElement('div');
  label.className = 'month-label';
  label.textContent = m.name + ' ' + m.year;
  document.body.appendChild(label);
  var grid = document.createElement('div');
  grid.className = 'cal';
  DOWS.forEach(function(d){ var h=document.createElement('div'); h.className='dow'; h.textContent=d; grid.appendChild(h); });
  for(var i=0;i<m.startDow;i++){ var e=document.createElement('div'); e.className='day empty'; grid.appendChild(e); }
  for(var d=1;d<=m.days;d++){
    var key=m.month+'-'+d;
    var val=SCHEDULE[key]||'';
    var isClosed = CLOSED_DAYS.indexOf(key) !== -1;
    var isNotStarted = NOT_STARTED.indexOf(key) !== -1;
    var cell=document.createElement('div');
    cell.className='day';
    if(isClosed) cell.className+=' closed';
    else if(isNotStarted) cell.className+=' not-started';
    else if(val==='OFF') cell.className+=' off';
    var num=document.createElement('div'); num.className='num'; num.textContent=d;
    var shift=document.createElement('div'); shift.className='shift';
    if(isClosed) shift.textContent='CLOSED';
    else if(isNotStarted) shift.textContent='';
    else if(val==='OFF') shift.textContent='OFF';
    else if(val) shift.textContent=val;
    cell.appendChild(num); cell.appendChild(shift); grid.appendChild(cell);
  }
  document.body.appendChild(grid);
});
</script>
</body>
</html>
