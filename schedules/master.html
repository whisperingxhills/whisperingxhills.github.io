body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; }
.header { text-align: center; margin-bottom: 24px; }

.month-label { font-size: 18px; font-weight: 700; margin: 24px 0 8px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 16px; }
.cal .dow { font-size: 11px; font-weight: 700; text-align: center; padding: 6px 2px; color: #64748b; text-transform: uppercase; }
.cal .day { background: #fff; border-radius: 8px; padding: 6px 4px; text-align: center; min-height: 90px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.cal .day .num { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.cal .day .park { font-size: 9px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
.cal .day .crew { font-size: 9px; line-height: 1.4; }
.cal .day .crew .person { display: block; }
.cal .day .crew .name { font-weight: 700; }
.cal .day .crew .f { color: #2563eb; }
.cal .day .crew .h { color: #7c3aed; }
.cal .day .crew .h2 { color: #d97706; }
.cal .day .crew .r { color: #dc2626; }
.cal .day .crew .tbd { color: #0d9488; }
.cal .day .crew .off-label { color: #94a3b8; font-weight: 400; }
.cal .day.closed { background: #f1f5f9; }
.cal .day.closed .num { color: #94a3b8; }
.cal .day.closed .park { color: #94a3b8; }
.cal .day.empty { background: transparent; box-shadow: none; }
@media print { body { padding: 0; } .cal .day { min-height: 75px; } }

function personLine(name, cls, val) {
  if (!val) return '';
  var label = val === 'OFF' ? '<span class="off-label">OFF</span>' : val;
  return '<span class="person"><span class="name '+cls+'">'+name+'</span> '+label+'</span>';
}

  label.className = 'month-label';
  label.textContent = m.name + ' ' + m.year;
  document.body.appendChild(label);
  var grid = document.createElement('div');
  grid.className = 'cal';
  DOWS.forEach(function(d){ var h=document.createElement('div'); h.className='dow'; h.textContent=d; grid.appendChild(h); });
