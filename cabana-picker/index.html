<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Island Waterpark — Cabana Coordinate Picker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #16213e; padding: 10px 20px; display: flex; align-items: center; gap: 12px;
    border-bottom: 2px solid #0f3460; flex-wrap: wrap;
  }
  .toolbar label { font-size: 13px; color: #aaa; }
  .toolbar select, .toolbar button {
    padding: 6px 12px; border-radius: 6px; border: 1px solid #0f3460;
    background: #1a1a2e; color: #eee; font-size: 14px; cursor: pointer;
  }
  .toolbar select:focus, .toolbar button:focus { outline: 2px solid #e94560; }
  .toolbar button { background: #e94560; border-color: #e94560; font-weight: 600; }
  .toolbar button:hover { background: #c73e54; }
  .toolbar button.secondary { background: #0f3460; border-color: #0f3460; }
  .toolbar button.secondary:hover { background: #16213e; }
  .toolbar .count { font-size: 13px; color: #e94560; font-weight: 600; }
  .toolbar .instructions { font-size: 12px; color: #888; }

  .map-container {
    margin-top: 70px; position: relative; display: inline-block; cursor: crosshair;
  }
  .map-container img {
    display: block; max-width: 100%; height: auto;
  }
  
  .marker {
    position: absolute; width: 18px; height: 18px; border-radius: 50%;
    background: #e94560; border: 2px solid #fff; transform: translate(-50%, -50%);
    cursor: pointer; z-index: 10; transition: transform 0.1s;
    font-size: 0;
  }
  .marker:hover { transform: translate(-50%, -50%) scale(1.4); }
  .marker.selected { background: #4ecca3; }
  
  .marker-label {
    position: absolute; transform: translate(-50%, 14px);
    font-size: 10px; color: #fff; background: rgba(0,0,0,0.7);
    padding: 1px 4px; border-radius: 3px; white-space: nowrap;
    pointer-events: none;
  }

  .panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: #16213e; border-top: 2px solid #0f3460;
    max-height: 250px; overflow-y: auto; padding: 10px 20px;
    display: none;
  }
  .panel.visible { display: block; }
  .panel h3 { margin-bottom: 8px; color: #e94560; font-size: 14px; }
  .panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .panel th { text-align: left; color: #aaa; padding: 4px 8px; border-bottom: 1px solid #0f3460; }
  .panel td { padding: 4px 8px; border-bottom: 1px solid #0f3460; }
  .panel td.actions button { padding: 2px 8px; font-size: 11px; }
  
  .toast {
    position: fixed; top: 80px; right: 20px; background: #4ecca3; color: #1a1a2e;
    padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; z-index: 200; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .zoom-controls {
    position: fixed; bottom: 270px; right: 20px; z-index: 100;
    display: flex; flex-direction: column; gap: 4px;
  }
  .zoom-controls button {
    width: 36px; height: 36px; border-radius: 6px; border: 1px solid #0f3460;
    background: #16213e; color: #eee; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<div class="toolbar">
  <label>Zone:</label>
  <select id="zoneSelect">
    <option value="">-- Select Zone --</option>
    <option value="Bamboo Bay">Bamboo Bay (1)</option>
    <option value="BBQ Cove">BBQ Cove (30)</option>
    <option value="Beach Bungalow">Beach Bungalow (4)</option>
    <option value="Beach Villa">Beach Villa (3)</option>
    <option value="Bayou Bungalow">Bayou Bungalow (2)</option>
    <option value="Family">Family (20)</option>
    <option value="Honu">Honu (6)</option>
    <option value="Kailua">Kailua (7)</option>
    <option value="Pete's Retreat">Pete's Retreat (1)</option>
    <option value="Premium">Premium (12)</option>
    <option value="River">River (6)</option>
    <option value="Sharky's">Sharky's (1)</option>
    <option value="Tide Pool">Tide Pool (9)</option>
    <option value="Waikiki Cove">Waikiki Cove (7)</option>
    <option value="Waimea Falls">Waimea Falls (13)</option>
    <option value="Wave Bungalow">Wave Bungalow (4)</option>
  </select>
  
  <label>Unit #:</label>
  <select id="unitSelect"><option value="">--</option></select>
  
  <span class="instructions">Select zone + unit, then click the map. Or just click to quick-add.</span>
  
  <span class="count" id="counter">0 placed</span>
  
  <button class="secondary" onclick="togglePanel()">📋 View All</button>
  <button class="secondary" onclick="undoLast()">↩ Undo</button>
  <button onclick="exportData()">⬇ Export JSON</button>
  <button onclick="exportCSV()">⬇ Export CSV</button>
  <button class="secondary" onclick="clearAll()" style="background:#c0392b;border-color:#c0392b;">🗑 Clear All</button>
</div>

<div class="toast" id="toast"></div>

<div class="map-container" id="mapContainer">
  <img src="map-base-new.png" id="mapImg" draggable="false">
</div>

<div class="zoom-controls">
  <button onclick="zoomIn()">+</button>
  <button onclick="zoomOut()">−</button>
  <button onclick="zoomReset()">⟳</button>
</div>

<div class="panel" id="panel">
  <h3>Placed Cabanas <span id="panelCount"></span></h3>
  <table>
    <thead><tr><th>#</th><th>Zone</th><th>Unit</th><th>X%</th><th>Y%</th><th>Actions</th></tr></thead>
    <tbody id="panelBody"></tbody>
  </table>
</div>

<script>
const CABANA_UNITS = {
  "Bamboo Bay": ["Bamboo Bay"],
  "BBQ Cove": Array.from({length:30}, (_,i) => `BBQ Cove ${String(i+1).padStart(2,'0')}`),
  "Beach Bungalow": Array.from({length:4}, (_,i) => `Beach Bungalow ${String(i+1).padStart(2,'0')}`),
  "Beach Villa": Array.from({length:3}, (_,i) => `Beach Villa ${String(i+1).padStart(2,'0')}`),
  "Bayou Bungalow": Array.from({length:2}, (_,i) => `Bayou Bungalow ${String(i+1).padStart(2,'0')}`),
  "Family": Array.from({length:20}, (_,i) => `Family ${String(i+1).padStart(2,'0')}`),
  "Honu": Array.from({length:6}, (_,i) => `Honu ${String(i+1).padStart(2,'0')}`),
  "Kailua": Array.from({length:7}, (_,i) => `Kailua ${String(i+1).padStart(2,'0')}`),
  "Pete's Retreat": ["Pete's Retreat"],
  "Premium": Array.from({length:12}, (_,i) => `Premium ${String(i+1).padStart(2,'0')}`),
  "River": Array.from({length:6}, (_,i) => `River ${String(i+1).padStart(2,'0')}`),
  "Sharky's": ["Sharky's"],
  "Tide Pool": Array.from({length:9}, (_,i) => `Tide Pool ${String(i+1).padStart(2,'0')}`),
  "Waikiki Cove": Array.from({length:7}, (_,i) => `Waikiki Cove ${String(i+1).padStart(2,'0')}`),
  "Waimea Falls": Array.from({length:13}, (_,i) => `Waimea ${String(i+1).padStart(2,'0')}`),
  "Wave Bungalow": Array.from({length:4}, (_,i) => `Wave Bungalow ${String(i+1).padStart(2,'0')}`),
};

const ZONE_COLORS = {
  "Bamboo Bay": "#4ecca3", "BBQ Cove": "#e94560", "Beach Bungalow": "#f5a623",
  "Beach Villa": "#7b68ee", "Bayou Bungalow": "#2ecc71", "Family": "#3498db",
  "Honu": "#e67e22", "Kailua": "#1abc9c", "Pete's Retreat": "#9b59b6",
  "Premium": "#f1c40f", "River": "#95a5a6", "Sharky's": "#e74c3c",
  "Tide Pool": "#00bcd4", "Waikiki Cove": "#ff6b9d", "Waimea Falls": "#26c6da",
  "Wave Bungalow": "#ff7043",
};

let placements = [];
let currentZoom = 1;
const mapContainer = document.getElementById('mapContainer');
const mapImg = document.getElementById('mapImg');
const zoneSelect = document.getElementById('zoneSelect');
const unitSelect = document.getElementById('unitSelect');

// Populate unit dropdown when zone changes
zoneSelect.addEventListener('change', () => {
  const zone = zoneSelect.value;
  unitSelect.innerHTML = '<option value="">--</option>';
  if (zone && CABANA_UNITS[zone]) {
    // Filter out already-placed units
    const placed = new Set(placements.filter(p => p.zone === zone).map(p => p.unit));
    CABANA_UNITS[zone].forEach(unit => {
      if (!placed.has(unit)) {
        const opt = document.createElement('option');
        opt.value = unit;
        opt.textContent = unit;
        unitSelect.appendChild(opt);
      }
    });
    // Auto-select first available
    if (unitSelect.options.length > 1) unitSelect.selectedIndex = 1;
  }
});

// Click on map to place
mapContainer.addEventListener('click', (e) => {
  if (e.target.classList.contains('marker')) return;
  
  const rect = mapImg.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
  const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
  
  const zone = zoneSelect.value;
  const unit = unitSelect.value;
  
  if (!zone || !unit) {
    showToast('⚠️ Select a zone and unit first');
    return;
  }
  
  // Check if already placed
  if (placements.find(p => p.unit === unit)) {
    showToast(`⚠️ ${unit} already placed`);
    return;
  }
  
  const placement = { zone, unit, x: parseFloat(x), y: parseFloat(y) };
  placements.push(placement);
  
  addMarker(placement, placements.length - 1);
  updateCounter();
  showToast(`✓ ${unit} placed at ${x}%, ${y}%`);
  
  // Auto-advance to next unit
  const currentIdx = unitSelect.selectedIndex;
  // Refresh unit list (removes placed ones)
  zoneSelect.dispatchEvent(new Event('change'));
});

function addMarker(placement, index) {
  const marker = document.createElement('div');
  marker.className = 'marker';
  marker.style.left = placement.x + '%';
  marker.style.top = placement.y + '%';
  marker.style.background = ZONE_COLORS[placement.zone] || '#e94560';
  marker.dataset.index = index;
  marker.title = placement.unit;
  
  const label = document.createElement('span');
  label.className = 'marker-label';
  // Short label: just the number or short name
  const shortName = placement.unit.replace(placement.zone, '').trim() || placement.unit;
  label.textContent = shortName || placement.unit;
  marker.appendChild(label);
  
  marker.addEventListener('click', (e) => {
    e.stopPropagation();
    {
      placements.splice(index, 1);
      renderAllMarkers();
      updateCounter();
      showToast(`Removed ${placement.unit}`);
    }
  });
  
  mapContainer.appendChild(marker);
}

function renderAllMarkers() {
  mapContainer.querySelectorAll('.marker').forEach(m => m.remove());
  placements.forEach((p, i) => addMarker(p, i));
}

function updateCounter() {
  document.getElementById('counter').textContent = `${placements.length} placed`;
  document.getElementById('panelCount').textContent = `(${placements.length})`;
  updatePanel();
}

function undoLast() {
  if (placements.length === 0) return;
  const removed = placements.pop();
  renderAllMarkers();
  updateCounter();
  showToast(`↩ Removed ${removed.unit}`);
  zoneSelect.dispatchEvent(new Event('change'));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Panel
function togglePanel() {
  document.getElementById('panel').classList.toggle('visible');
  updatePanel();
}

function updatePanel() {
  const tbody = document.getElementById('panelBody');
  tbody.innerHTML = '';
  placements.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td>${p.zone}</td><td>${p.unit}</td><td>${p.x}</td><td>${p.y}</td>
      <td class="actions"><button class="secondary" onclick="removePlacement(${i})">✕</button></td>`;
    tbody.appendChild(tr);
  });
}

function removePlacement(index) {
  const removed = placements.splice(index, 1)[0];
  renderAllMarkers();
  updateCounter();
  showToast(`Removed ${removed.unit}`);
}

// Export
function exportData() {
  const data = JSON.stringify(placements, null, 2);
  download('cabana-coordinates.json', data, 'application/json');
  showToast(`✓ Exported ${placements.length} coordinates`);
}

function exportCSV() {
  let csv = 'Zone,Unit,X%,Y%\n';
  placements.forEach(p => {
    csv += `"${p.zone}","${p.unit}",${p.x},${p.y}\n`;
  });
  download('cabana-coordinates.csv', csv, 'text/csv');
  showToast(`✓ Exported CSV`);
}

function download(filename, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// Zoom
function zoomIn() { currentZoom = Math.min(currentZoom + 0.25, 4); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom - 0.25, 0.5); applyZoom(); }
function zoomReset() { currentZoom = 1; applyZoom(); }
function applyZoom() {
  mapImg.style.width = (100 * currentZoom) + '%';
  showToast(`Zoom: ${Math.round(currentZoom * 100)}%`);
}

// Load saved data if exists
try {
  const saved = localStorage.getItem('cabana-placements');
  if (saved) {
    placements = JSON.parse(saved);
    renderAllMarkers();
    updateCounter();
  }
} catch(e) {}

// Auto-save to localStorage
setInterval(() => {
  localStorage.setItem('cabana-placements', JSON.stringify(placements));
}, 5000);

function clearAll() {
  if (!confirm("Clear ALL placements? This cannot be undone.")) return;
  placements = [];
  renderAllMarkers();
  updateCounter();
  localStorage.removeItem("cabana-placements");
  showToast("Cleared all placements");
  zoneSelect.dispatchEvent(new Event("change"));
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'z' && e.ctrlKey) { e.preventDefault(); undoLast(); }
  if (e.key === '+' || e.key === '=') { zoomIn(); }
  if (e.key === '-') { zoomOut(); }
});
</script>

</body>
</html>
